<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>単語工場 -WORD FACTORY-</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Noto+Sans+JP:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --steel-900:#14161b;
  --steel-800:#1d2027;
  --steel-700:#2a2e37;
  --steel-600:#3a3f4a;
  --steel-500:#565d6b;
  --yellow:#ffc72c;
  --yellow-dark:#c99400;
  --orange:#ff6a3d;
  --blue:#4fa3d1;
  --green:#3ddc84;
  --red:#ff4757;
  --paper:#f4ecd8;
  --font-d:'Archivo Black', 'Noto Sans JP', sans-serif;
  --font-b:'Noto Sans JP', sans-serif;
  --font-m:'Space Mono', monospace;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
html,body{margin:0;padding:0;height:100%;background:var(--steel-900);font-family:var(--font-b);overflow:hidden;}
#app{
  position:relative;
  width:100%;
  height:100vh;
  height:100dvh;
  background:
    radial-gradient(circle at 20% 10%, rgba(255,199,44,0.05), transparent 40%),
    repeating-linear-gradient(0deg, #17191f 0px, #17191f 2px, #14161b 2px, #14161b 40px),
    var(--steel-900);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

/* ---------- shared ---------- */
.screen{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;}
.hidden{display:none !important;}
button{font-family:var(--font-d);cursor:pointer;border:none;outline:none;}
.btn{
  font-family:var(--font-d);
  color:#1c1c1c;
  background:linear-gradient(180deg, var(--yellow), var(--yellow-dark));
  padding:16px 40px;
  border-radius:10px;
  font-size:18px;
  letter-spacing:1px;
  box-shadow:0 6px 0 #8a6a00, 0 8px 14px rgba(0,0,0,0.5);
  border:3px solid #2a2010;
  transition:transform .08s ease;
}
.btn:active{transform:translateY(6px);box-shadow:0 0 0 #8a6a00, 0 2px 6px rgba(0,0,0,0.5);}
.btn.secondary{
  background:linear-gradient(180deg, #6d7684, #3a3f4a);
  color:#f4ecd8;
  box-shadow:0 6px 0 #1c1e23, 0 8px 14px rgba(0,0,0,0.5);
}
.btn.secondary:active{box-shadow:0 0 0 #1c1e23, 0 2px 6px rgba(0,0,0,0.5);}

/* ---------- start screen ---------- */
#screen-start{padding:20px;text-align:center;}
.factory-sign{
  position:relative;
  padding:26px 34px;
  background:linear-gradient(180deg,#2a2e37,#1d2027);
  border:4px solid #464c58;
  border-radius:14px;
  box-shadow:0 10px 0 #0c0d10, 0 16px 30px rgba(0,0,0,0.6), inset 0 0 30px rgba(0,0,0,0.4);
  max-width:420px;
}
.factory-sign::before, .factory-sign::after{content:'';position:absolute;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#8b8f99,#2b2e35);top:10px;box-shadow:0 1px 2px rgba(0,0,0,0.6);}
.factory-sign::before{left:10px;}
.factory-sign::after{right:10px;}
.eyebrow{font-family:var(--font-m);color:var(--yellow);letter-spacing:4px;font-size:12px;margin-bottom:6px;}
.title-jp{font-family:var(--font-b);font-weight:900;color:var(--paper);font-size:26px;margin:0 0 4px;}
.title-en{font-family:var(--font-d);color:var(--orange);font-size:34px;letter-spacing:2px;margin:0 0 18px;text-shadow:3px 3px 0 #1a1a1a;}
.desc{color:#b8bcc4;font-size:13px;line-height:1.8;margin-bottom:20px;}
.desc b{color:var(--yellow);}
.stamp-hint{
  display:inline-block;
  border:3px solid var(--red);
  color:var(--red);
  font-family:var(--font-d);
  font-size:11px;
  padding:4px 10px;
  border-radius:6px;
  transform:rotate(-6deg);
  margin-bottom:18px;
  letter-spacing:1px;
}

/* ---------- game screen ---------- */
#screen-game{width:100%;height:100%;display:flex;flex-direction:column;padding:10px 12px;}
.hud{
  display:flex;
  justify-content:space-between;
  align-items:stretch;
  gap:8px;
  padding:8px 10px;
  background:linear-gradient(180deg,#2a2e37,#1d2027);
  border:3px solid #464c58;
  border-radius:12px;
  box-shadow:0 6px 0 #0c0d10, inset 0 0 14px rgba(0,0,0,0.4);
  flex-shrink:0;
}
.gauge{text-align:center;flex:1;position:relative;}
.gauge-label{font-family:var(--font-m);font-size:9px;color:#8b909c;letter-spacing:2px;}
.gauge-value{font-family:var(--font-d);font-size:20px;color:var(--yellow);text-shadow:1px 1px 0 #000;}
.gauge.combo .gauge-value{color:var(--orange);}
.gauge.round .gauge-value{color:var(--blue);}
.divider-v{width:2px;background:#464c58;margin:2px 0;}

.order-slip{
  margin-top:10px;
  background:var(--paper);
  border-radius:6px;
  padding:12px 18px;
  position:relative;
  box-shadow:0 6px 12px rgba(0,0,0,0.5), 0 2px 0 #d8cba0;
  transform:rotate(-1deg);
  flex-shrink:0;
  max-width:92%;
  align-self:center;
}
.order-slip::before{
  content:'発注書';
  position:absolute;
  top:-10px;left:14px;
  background:var(--red);
  color:#fff;
  font-family:var(--font-d);
  font-size:10px;
  padding:2px 8px;
  border-radius:3px;
  transform:rotate(-3deg);
}
.order-jp{font-size:20px;font-weight:700;color:#2a2010;text-align:center;letter-spacing:1px;}

.slots{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
  padding:14px 6px;
  flex-shrink:0;
  min-height:56px;
}
.slot{
  width:38px;height:44px;
  border:2px dashed #ffc72c;
  border-radius:6px;
  background:rgba(255,255,255,0.08);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-d);
  font-size:24px;
  color:#ffffff;
  transition:transform .15s ease, background .15s ease, border-color .15s;
}
.slot.filled{
  border-style:solid;
  border-color:var(--green);
  background:linear-gradient(180deg,#3a4a3f,#2a3530);
  color: var(--green);
}
.slot.pop{animation:pop .3s ease;}
@keyframes pop{0%{transform:scale(0.6);}60%{transform:scale(1.25);}100%{transform:scale(1);}}

.belt-wrap{
  position:relative;
  width:100%;
  flex:1;
  margin-top:6px;
  border-radius:12px;
  overflow:hidden;
  border:3px solid #464c58;
  box-shadow:inset 0 8px 20px rgba(0,0,0,0.6), 0 6px 0 #0c0d10;
  background:#1a1c21;
  min-height:160px;
}
.belt-track{
  position:absolute;
  inset:0;
  background:
    repeating-linear-gradient(115deg, #3a3320 0 26px, #26210f 26px 52px);
  background-size:200% 100%;
  animation:beltmove 1.2s linear infinite;
}
@keyframes beltmove{from{background-position:0 0;}to{background-position:-73.9px 0;}}
.belt-rail{position:absolute;left:0;right:0;height:6px;background:#0c0d10;box-shadow:inset 0 1px 2px rgba(0,0,0,0.8);z-index:2;}
.belt-rail.top{top:0;}
.belt-rail.bottom{bottom:0;}

/* タイルの配置と視認性を固定化 */
.tile{
  position:absolute;
  width:50px;
  height:56px;
  background:linear-gradient(180deg, #ffe066, #f59e0b);
  border:3px solid #78350f;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:var(--font-d);
  font-size:28px;
  font-weight:900;
  color:#1e1b4b;
  box-shadow:0 6px 12px rgba(0,0,0,0.6), inset 0 2px 0 rgba(255,255,255,0.8);
  cursor:pointer;
  z-index:10;
  touch-action:manipulation;
}
.tile.wrong{animation:shakeTile .35s ease;background:linear-gradient(180deg,#ef4444,#dc2626);border-color:#7f1d1d;color:#fff;}
@keyframes shakeTile{0%,100%{transform:translateX(0);}20%{transform:translateX(-8px) rotate(-6deg);}40%{transform:translateX(8px) rotate(6deg);}60%{transform:translateX(-6px) rotate(-4deg);}80%{transform:translateX(6px) rotate(4deg);}}
.tile.flyaway{transition:top .35s cubic-bezier(.3,-0.4,.6,1.3), left .35s cubic-bezier(.3,-0.4,.6,1.3), opacity .35s, transform .35s; opacity:0; z-index:20;}

.stampfx{
  position:absolute;
  left:50%;top:40%;
  transform:translate(-50%,-50%) scale(0) rotate(-14deg);
  font-family:var(--font-d);
  font-size:44px;
  color:var(--green);
  text-shadow:0 0 12px rgba(61,220,132,0.8);
  border:6px solid var(--green);
  padding:2px 18px;
  border-radius:8px;
  pointer-events:none;
  z-index:40;
  opacity:0;
}
.stampfx.show{animation:stampIn .6s cubic-bezier(.2,1.6,.4,1) forwards;}
@keyframes stampIn{0%{opacity:0;transform:translate(-50%,-50%) scale(2.2) rotate(-14deg);}30%{opacity:1;transform:translate(-50%,-50%) scale(0.9) rotate(-14deg);}45%{transform:translate(-50%,-50%) scale(1.08) rotate(-14deg);}70%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-14deg);}100%{opacity:0;transform:translate(-50%,-50%) scale(1) rotate(-14deg);}}

.levelupfx{
  position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%) scale(0.5);
  font-family:var(--font-d);
  font-size:30px;
  color:var(--yellow);
  text-shadow:0 0 20px rgba(255,199,44,0.9), 3px 3px 0 #000;
  opacity:0;
  z-index:50;
  pointer-events:none;
  text-align:center;
}
.levelupfx.show{animation:levelUp 1.1s ease forwards;}
@keyframes levelUp{0%{opacity:0;transform:translate(-50%,-50%) scale(0.4);}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15);}30%{transform:translate(-50%,-50%) scale(1);}80%{opacity:1;}100%{opacity:0;transform:translate(-50%,-50%) scale(1.3) translateY(-30px);}}

.particle{position:absolute;width:7px;height:7px;border-radius:2px;pointer-events:none;z-index:35;}

#app.shake{animation:screenShake .35s ease;}
@keyframes screenShake{0%,100%{transform:translate(0,0);}20%{transform:translate(-8px,4px);}40%{transform:translate(8px,-4px);}60%{transform:translate(-6px,3px);}80%{transform:translate(6px,-3px);}}

/* ---------- result screen ---------- */
#screen-result{text-align:center;padding:20px;}
.result-card{
  background:linear-gradient(180deg,#2a2e37,#1d2027);
  border:4px solid #464c58;
  border-radius:16px;
  padding:28px 30px;
  box-shadow:0 10px 0 #0c0d10, 0 16px 30px rgba(0,0,0,0.6);
  max-width:400px;
}
.rank-badge{font-family:var(--font-d);font-size:14px;color:var(--yellow);letter-spacing:3px;}
.rank-title{font-family:var(--font-b);font-weight:900;font-size:30px;color:var(--paper);margin:6px 0 18px;}
.result-stat{display:flex;justify-content:space-between;color:#c9cdd6;font-size:14px;padding:8px 4px;border-bottom:1px dashed #464c58;}
.result-stat b{font-family:var(--font-d);color:var(--yellow);font-size:16px;}
.result-actions{margin-top:22px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}

.footer-note{position:absolute;bottom:6px;font-size:9px;color:#454a55;font-family:var(--font-m);letter-spacing:1px;}
</style>
</head>
<body>
<div id="app">

  <!-- START SCREEN -->
  <div class="screen" id="screen-start">
    <div class="factory-sign">
      <div class="eyebrow">EIGO SEIZOU KOUJOU</div>
      <div class="title-jp">単語工場</div>
      <div class="title-en">WORD FACTORY</div>
      <div class="desc">ベルトコンベアーから流れてくる<br><b>文字パーツ</b>を正しい順番でタップして<br>英単語を組み立てよう！<br>間違えた単語はまた出やすくなるよ。</div>
      <div class="stamp-hint">全10問チャレンジ</div><br>
      <button class="btn" id="btn-start">▶ 操業開始</button>
    </div>
    <div class="footer-note">TAP THE LETTERS ON THE BELT IN ORDER</div>
  </div>

  <!-- GAME SCREEN -->
  <div class="screen hidden" id="screen-game">
    <div class="hud">
      <div class="gauge"><div class="gauge-label">LEVEL</div><div class="gauge-value" id="hud-level">1</div></div>
      <div class="divider-v"></div>
      <div class="gauge"><div class="gauge-label">SCORE</div><div class="gauge-value" id="hud-score">0</div></div>
      <div class="divider-v"></div>
      <div class="gauge combo"><div class="gauge-label">COMBO</div><div class="gauge-value" id="hud-combo">x0</div></div>
      <div class="divider-v"></div>
      <div class="gauge round"><div class="gauge-label">ROUND</div><div class="gauge-value" id="hud-round">1/10</div></div>
    </div>

    <div class="order-slip">
      <div class="order-jp" id="order-jp">読み込み中...</div>
    </div>

    <div class="slots" id="slots"></div>

    <div class="belt-wrap" id="belt-wrap">
      <div class="belt-rail top"></div>
      <div class="belt-track" id="belt-track"></div>
      <div class="belt-rail bottom"></div>
      <div class="stampfx" id="stampfx">GOOD!</div>
      <div class="levelupfx" id="levelupfx">LEVEL UP!</div>
    </div>
  </div>

  <!-- RESULT SCREEN -->
  <div class="screen hidden" id="screen-result">
    <div class="result-card">
      <div class="rank-badge">FACTORY RANK</div>
      <div class="rank-title" id="result-rank">見習い工員</div>
      <div class="result-stat"><span>最終スコア</span><b id="result-score">0</b></div>
      <div class="result-stat"><span>到達レベル</span><b id="result-level">1</b></div>
      <div class="result-stat"><span>正確率</span><b id="result-accuracy">0%</b></div>
      <div class="result-stat"><span>最大コンボ</span><b id="result-maxcombo">0</b></div>
      <div class="result-actions">
        <button class="btn" id="btn-retry">🔁 もう一度</button>
        <button class="btn secondary" id="btn-title">🏠 タイトルへ</button>
      </div>
    </div>
  </div>

</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  "use strict";

  const WORD_BANK = [
    ["same","同じ"],["experience","経験、体験"],["actually","実は"],["holiday","休日"],
    ["arrive","到着する"],["soon","すぐに"],["will","～でしょう"],["excited","わくわくした"],
    ["tall","高さがある"],["find","見つける"],["found","見つけた（findの過去形）"],["language","言語"],
    ["area","エリア"],["culture","文化"],["speech","スピーチ"],["if","もしも"],
    ["forget","忘れる"],["thick","濃い、とろっとした"],["early","早い"],["foreign","外国の"],
    ["change","変化する"],["may","～してもよい"],["could","～できた（canの過去形）"],["golden","金色の"],
    ["flight","飛行"],["airport","空港"],["seafood","シーフード"],["reservation","予約"],
    ["meter","メートル"],["weigh","重さがある"],["ton","トン"],["dollar","ドル"],
    ["communicate","意思疎通をする"],["painting","絵"],["wall","壁"],["surprised","驚いた"],
    ["especially","特に"],["order","注文する"],["topping","トッピング"],["various","いろいろな"],
    ["flavor","味"],["salt","塩"],["sometime","いつか"],["add","加える"],
    ["butter","バター"],["recommended","おすすめの"],["manufacture","製造業者"],["reflect","反映する"],
    ["climate","気候"],["life","生活"],["lives","生活（複数形）"],["creativity","創造性"],
    ["chef","シェフ"],["variation","変化"],["create","創造する"],["sauce","ソース"],
    ["traveler","旅行者"],["resident","居住者"],["menu","メニュー"],["singapore","シンガポール"],
    ["went","行った（goの過去形）"],["was","～だった（is,amの過去形）"],["were","～だった（areの過去形）"],["had","持っていた（haveの過去形）"],
    ["saw","見た（seeの過去形）"],["bought","買った（buyの過去形）"],["did","した（doの過去形）"],["came","来た（comeの過去形）"],
    ["made","作った（makeの過去形）"],["took","取った（takeの過去形）"],["world","世界"],["interesting","面白い"],
    ["enjoy","楽しむ"],["different","異なった"],["english","英語"],["leave","出発する"],
    ["family","家族"],["brother","兄弟"],["open","～を開く"],["breakfast","朝食"],
    ["people","人々"],["know","知っている"],["egg","卵"]
  ];

  const mistakeWeight = {};
  WORD_BANK.forEach(w=>mistakeWeight[w[0]]=0);

  let actx = null;
  function ac(){ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); return actx; }
  function tone(freq,dur,type,vol,delay){
    type=type||'square'; vol=vol===undefined?0.15:vol; delay=delay||0;
    try {
      const c=ac(); const t0=c.currentTime+delay;
      const osc=c.createOscillator(); const g=c.createGain();
      osc.type=type; osc.frequency.setValueAtTime(freq,t0);
      g.gain.setValueAtTime(0,t0);
      g.gain.linearRampToValueAtTime(vol,t0+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
      osc.connect(g); g.connect(c.destination);
      osc.start(t0); osc.stop(t0+dur+0.02);
    } catch(e){}
  }
  function sfxCorrectLetter(step){ tone(440+step*60,0.12,'triangle',0.16); }
  function sfxWrong(){ tone(180,0.18,'sawtooth',0.18); tone(120,0.22,'sawtooth',0.14,0.05); }
  function sfxWordComplete(){ [523,659,784,1046].forEach((f,i)=>tone(f,0.16,'triangle',0.18,i*0.09)); }
  function sfxLevelUp(){ [392,523,659,784,988].forEach((f,i)=>tone(f,0.18,'square',0.14,i*0.07)); }
  function sfxGameOver(){ [659,523,440,330].forEach((f,i)=>tone(f,0.22,'triangle',0.16,i*0.14)); }
  function sfxStart(){ [330,440,554].forEach((f,i)=>tone(f,0.12,'square',0.14,i*0.08)); }

  let state = {};
  function resetState(){
    state = {
      score:0, level:1, combo:0, maxCombo:0,
      round:0, totalRounds:10,
      queue:[], currentWord:"", currentJp:"", cleanWord:"", currentIdx:0,
      tiles:[], animId:null, beltSpeed:0.55,
      totalMistakes:0, totalLetters:0, locked:false, roundMistake:false
    };
  }

  function buildQueue(){
    const pool = WORD_BANK.slice();
    const picks = [];
    const n = Math.min(10, pool.length);
    for(let i=0; i<n; i++){
      let weights = pool.map(w => 1 + (mistakeWeight[w[0]] || 0) * 3);
      let total = weights.reduce((a,b)=>a+b, 0);
      let r = Math.random() * total;
      let idx = 0;
      for(; idx<weights.length; idx++){
        r -= weights[idx];
        if(r <= 0) break;
      }
      if(idx >= pool.length) idx = pool.length - 1;
      picks.push(pool[idx]);
      pool.splice(idx, 1);
    }
    return picks;
  }

  const el = id => document.getElementById(id);
  const screens = {start:el('screen-start'), game:el('screen-game'), result:el('screen-result')};
  function showScreen(name){
    Object.values(screens).forEach(s => s.classList.add('hidden'));
    screens[name].classList.remove('hidden');
  }

  function startGame(){
    resetState();
    state.queue = buildQueue();
    updateHud();
    showScreen('game');
    // 画面切り替え後に領域サイズを安全に判定できるように少し遅延して開始
    requestAnimationFrame(() => {
      nextRound();
    });
  }

  function updateHud(){
    el('hud-level').textContent = state.level;
    el('hud-score').textContent = state.score;
    el('hud-combo').textContent = 'x' + state.combo;
    el('hud-round').textContent = Math.min(state.round + 1, state.totalRounds) + '/' + state.totalRounds;
  }

  function nextRound(){
    if(state.round >= state.totalRounds){ endGame(); return; }
    state.locked = false;
    state.roundMistake = false;
    
    const [word, jp] = state.queue[state.round];
    state.currentWord = word;
    state.currentJp = jp;
    state.cleanWord = word.toLowerCase().replace(/[^a-z]/g, '');
    state.currentIdx = 0;
    
    el('order-jp').textContent = jp;
    updateHud();
    buildSlots(state.cleanWord);
    buildBelt(state.cleanWord);
  }

  function buildSlots(cleanWord){
    const box = el('slots');
    box.innerHTML = '';
    for(let i=0; i<cleanWord.length; i++){
      const d = document.createElement('div');
      d.className = 'slot';
      d.id = 'slot-' + i;
      box.appendChild(d);
    }
  }

  const DECOY_LETTERS = 'abcdefghijklmnopqrstuvwxyz';
  function buildBelt(cleanWord){
    const track = el('belt-wrap');
    
    // 既存タイルの削除
    state.tiles.forEach(t => t.el && t.el.remove());
    state.tiles = [];
    if(state.animId) cancelAnimationFrame(state.animId);

    const decoyCount = Math.min(5, 2 + state.level);
    let letters = cleanWord.split('');
    const needed = {};
    letters.forEach(l => needed[l] = (needed[l] || 0) + 1);
    
    const extra = [];
    for(let i=0; i<decoyCount; i++){
      let c;
      do { c = DECOY_LETTERS[Math.floor(Math.random() * DECOY_LETTERS.length)]; }
      while(needed[c]);
      extra.push(c);
    }
    
    let all = letters.concat(extra);
    for(let i=all.length-1; i>0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [all[i], all[j]] = [all[j], all[i]];
    }

    // ベルト幅のデフォルト値保証
    const beltW = track.clientWidth || 320;
    const beltH = track.clientHeight || 160;
    state.beltSpeed = 0.4 + state.level * 0.12;

    all.forEach((letter, i) => {
      const d = document.createElement('div');
      d.className = 'tile';
      d.textContent = letter.toUpperCase();
      
      // 最初は画面右側の領域から順番に流す
      const startX = beltW + i * 85;
      const y = Math.max(20, (beltH / 2) - 28 + (Math.random() * 20 - 10));
      
      d.style.left = startX + 'px';
      d.style.top = y + 'px';
      track.appendChild(d);
      
      const tileObj = { el:d, x:startX, y:y, letter:letter, alive:true };
      
      const onSelect = (e) => {
        if(e.type === 'touchstart') e.preventDefault();
        handleTileClick(tileObj);
      };
      d.addEventListener('click', onSelect);
      d.addEventListener('touchstart', onSelect, {passive:false});
      
      state.tiles.push(tileObj);
    });

    animateBelt();
  }

  function animateBelt(){
    const track = el('belt-wrap');
    
    function step(){
      const beltW = track.clientWidth || 320;
      const beltH = track.clientHeight || 160;

      state.tiles.forEach(t => {
        if(!t.alive) return;
        t.x -= state.beltSpeed * 3.5;
        
        // 画面左端に消えたら右から再登場
        if(t.x < -60){
          t.x = beltW + Math.random() * 60 + 20;
          t.y = Math.max(20, (beltH / 2) - 28 + (Math.random() * 20 - 10));
        }
        t.el.style.left = t.x + 'px';
        t.el.style.top = t.y + 'px';
      });
      state.animId = requestAnimationFrame(step);
    }
    step();
  }

  function handleTileClick(tileObj){
    if(state.locked || !tileObj.alive) return;
    const need = state.cleanWord[state.currentIdx];
    ac();
    
    if(tileObj.letter === need){
      tileObj.alive = false;
      state.totalLetters++;
      placeIntoSlot(tileObj, state.currentIdx);
      sfxCorrectLetter(state.currentIdx);
      state.currentIdx++;
      
      if(state.currentIdx >= state.cleanWord.length){
        state.locked = true;
        setTimeout(completeWord, 380);
      }
    } else {
      state.totalMistakes++;
      state.combo = 0;
      state.roundMistake = true;
      mistakeWeight[state.currentWord] = (mistakeWeight[state.currentWord] || 0) + 1;
      updateHud();
      tileObj.el.classList.add('wrong');
      sfxWrong();
      shakeScreen();
      setTimeout(() => tileObj.el.classList.remove('wrong'), 350);
    }
  }

  function placeIntoSlot(tileObj, idx){
    const slot = el('slot-' + idx);
    const slotRect = slot.getBoundingClientRect();
    const wrapRect = el('belt-wrap').getBoundingClientRect();
    tileObj.el.classList.add('flyaway');
    tileObj.el.style.left = (slotRect.left - wrapRect.left) + 'px';
    tileObj.el.style.top = (slotRect.top - wrapRect.top) + 'px';
    setTimeout(() => {
      slot.textContent = tileObj.letter.toUpperCase();
      slot.classList.add('filled', 'pop');
      tileObj.el.remove();
    }, 340);
  }

  function completeWord(){
    const bonusCombo = state.combo;
    state.combo++;
    state.maxCombo = Math.max(state.maxCombo, state.combo);
    const gained = 100 + bonusCombo * 20 + (!state.roundMistake ? 30 : 0);
    state.score += gained;
    state.round++;

    sfxWordComplete();
    popStamp();
    burstParticles();
    updateHud();

    if(state.round % 3 === 0 && state.round < state.totalRounds){
      state.level++;
      setTimeout(() => { sfxLevelUp(); showLevelUp(); }, 400);
    }

    setTimeout(nextRound, state.round % 3 === 0 && state.round < state.totalRounds ? 1300 : 600);
  }

  function popStamp(){
    const s = el('stampfx');
    s.classList.remove('show'); void s.offsetWidth; s.classList.add('show');
  }
  function showLevelUp(){
    const l = el('levelupfx');
    l.textContent = 'LEVEL UP! Lv.' + state.level;
    l.classList.remove('show'); void l.offsetWidth; l.classList.add('show');
  }
  function shakeScreen(){
    const app = el('app');
    app.classList.remove('shake'); void app.offsetWidth; app.classList.add('shake');
  }
  function burstParticles(){
    const wrap = el('belt-wrap');
    const colors = ['#ffc72c', '#ff6a3d', '#3ddc84', '#4fa3d1'];
    for(let i=0; i<16; i++){
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.background = colors[i % colors.length];
      p.style.left = (wrap.clientWidth / 2) + 'px';
      p.style.top = (wrap.clientHeight / 2) + 'px';
      wrap.appendChild(p);
      const ang = Math.random() * Math.PI * 2;
      const dist = 50 + Math.random() * 80;
      const dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist;
      p.animate([
        { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
        { transform: `translate(${dx}px,${dy}px) rotate(${Math.random()*360}deg)`, opacity: 0 }
      ], { duration: 600, easing: 'cubic-bezier(.2,.6,.4,1)' });
      setTimeout(() => p.remove(), 600);
    }
  }

  function endGame(){
    if(state.animId) cancelAnimationFrame(state.animId);
    sfxGameOver();
    const acc = (state.totalLetters + state.totalMistakes > 0) 
      ? Math.round(100 * state.totalLetters / (state.totalLetters + state.totalMistakes)) 
      : 100;
      
    el('result-score').textContent = state.score;
    el('result-level').textContent = state.level;
    el('result-accuracy').textContent = acc + '%';
    el('result-maxcombo').textContent = state.maxCombo;

    let rank = '見習い工員';
    if(state.score >= 1400) rank = '伝説の職人マイスター';
    else if(state.score >= 1100) rank = '工場長';
    else if(state.score >= 800) rank = '熟練職人';
    else if(state.score >= 500) rank = '一人前の工員';
    el('result-rank').textContent = rank;

    showScreen('result');
  }

  el('btn-start').addEventListener('click', () => { ac(); sfxStart(); startGame(); });
  el('btn-retry').addEventListener('click', () => { sfxStart(); startGame(); });
  el('btn-title').addEventListener('click', () => { showScreen('start'); });
});
</script>
