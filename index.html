<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>単語工場 -WORD FACTORY-</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Noto+Sans+JP:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
:root{
  --steel-900:#14161b; --steel-800:#1d2027; --steel-700:#2a2e37; --steel-600:#3a3f4a; --steel-500:#565d6b;
  --yellow:#ffc72c; --yellow-dark:#c99400; --orange:#ff6a3d; --blue:#4fa3d1; --green:#3ddc84; --red:#ff4757; --purple:#a855f7;
  --paper:#f4ecd8;
  --font-d:'Archivo Black', 'Noto Sans JP', sans-serif;
  --font-b:'Noto Sans JP', sans-serif;
  --font-m:'Space Mono', monospace;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
html,body{margin:0;padding:0;height:100vh;height:100dvh;background:var(--steel-900);font-family:var(--font-b);overflow:hidden;}
#app{position:relative;z-index:1;width:100%;height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;}

/* Screens & Layout */
.screen{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:12px;}
.hidden{display:none !important;}
button{font-family:var(--font-d);cursor:pointer;border:none;outline:none;}
.btn{
  font-family:var(--font-d); color:#1c1c1c; background:linear-gradient(180deg, var(--yellow), var(--yellow-dark));
  padding:12px 24px; border-radius:10px; font-size:15px; letter-spacing:1px;
  box-shadow:0 4px 0 #8a6a00, 0 6px 12px rgba(0,0,0,0.4); border:2px solid #2a2010; transition:transform .08s ease;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8a6a00;}
.btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;box-shadow:none;}
.btn.secondary{background:linear-gradient(180deg, #6d7684, #3a3f4a); color:#f4ecd8; box-shadow:0 4px 0 #1c1e23; border-color:#1c1e23;}
.btn.purple{background:linear-gradient(180deg, #c084fc, #7e22ce); color:#fff; box-shadow:0 4px 0 #581c87; border-color:#3b0764;}

.panel-card{
  background:linear-gradient(180deg,#2a2e37,#1d2027); border:3px solid #464c58; border-radius:16px;
  padding:16px; box-shadow:0 10px 20px rgba(0,0,0,0.6); max-width:440px; width:100%; max-height:88vh; display:flex; flex-direction:column;
}
.panel-title{font-family:var(--font-b);font-weight:900;font-size:18px;color:var(--paper);text-align:center;margin-bottom:10px;}

/* Game HUD & Conveyor */
#screen-game{padding:8px;justify-content:flex-start;}
.hud{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px 12px;background:#1d2027;border:2px solid #464c58;border-radius:12px;width:100%;max-width:440px;}
.gauge{text-align:center;flex:1;}
.gauge-label{font-family:var(--font-m);font-size:9px;color:#8b909c;}
.gauge-value{font-family:var(--font-d);font-size:16px;color:var(--yellow);}

.order-slip{margin:10px 0 6px;background:var(--paper);border-radius:8px;padding:12px 20px;transform:rotate(-1deg);box-shadow:0 4px 8px rgba(0,0,0,0.4);text-align:center;}
.order-jp{font-size:26px;font-weight:900;color:#2a2010;}
.order-stats{font-size:10px;color:#7a6b52;margin-top:2px;}

.slots{display:flex;justify-content:center;align-items:center;gap:4px;padding:8px 0;min-height:64px;width:100%;flex-wrap:wrap;}
.slot{width:36px;height:46px;border:2px dashed #565d6b;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-size:22px;color:var(--paper);background:rgba(0,0,0,0.2);}
.slot.filled{border-style:solid;border-color:var(--green);background:#2a3530;}

.belt-wrap{position:relative;width:100%;max-width:440px;flex:1;margin-top:8px;border-radius:12px;overflow:hidden;border:3px solid #464c58;background:#1a1c21;min-height:160px;}
.belt-track{position:absolute;inset:0;background:repeating-linear-gradient(115deg, #34383f 0 20px, #131417 20px 40px);background-size:200% 100%;animation:beltmove 1.5s linear infinite;}
@keyframes beltmove{from{background-position:0 0;}to{background-position:-56.5px 0;}}

.tile-container{position:absolute;inset:0;overflow:hidden;}
.tile{
  position:absolute; width:44px; height:52px; background:linear-gradient(180deg,#e8dcc0,#c9b98d);
  border:2px solid #5a4a2a; border-radius:6px; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-d); font-size:24px; color:#2a2010; cursor:pointer; box-shadow:0 4px 6px rgba(0,0,0,0.3);
  top:50%; transform:translateY(-50%); transition:transform 0.1s;
}
.tile:active{transform:translateY(-50%) scale(0.95);}

/* Collection & Lists */
.tab-row{display:flex;gap:6px;margin-bottom:10px;}
.tab-btn{flex:1;padding:8px;background:#3a3f4a;color:#aaa;border-radius:6px;font-size:11px;text-align:center;}
.tab-btn.active{background:var(--yellow);color:#1c1c1c;font-weight:700;}

.grid-container{overflow-y:auto;flex:1;display:grid;grid-template-columns:repeat(3, 1fr);gap:8px;padding:4px;}
.item-card{background:#14161b;border:2px solid #3a3f4a;border-radius:8px;padding:8px;text-align:center;position:relative;cursor:pointer;}
.item-card.locked{opacity:0.5;}
.item-card.locked .item-icon{filter:brightness(0) blur(2px);}
.item-icon{font-size:28px;margin-bottom:2px;}
.item-name{font-size:10px;color:var(--paper);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item-count{font-size:9px;color:var(--yellow);}

.ranking-item{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:#14161b;border:1px solid #3a3f4a;border-radius:6px;margin-bottom:6px;}
.rank-num{font-family:var(--font-d);font-size:14px;color:var(--yellow);width:28px;}
.rank-info{flex:1;text-align:left;}
.rank-name{font-size:12px;color:var(--paper);font-weight:700;}
.rank-title{font-size:9px;color:var(--orange);}
.rank-val{font-family:var(--font-m);font-size:12px;color:var(--green);}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;}
.modal-card{background:#2a2e37;border:3px solid #464c58;border-radius:14px;padding:18px;max-width:340px;width:100%;text-align:center;}
input[type="text"]{width:100%;padding:10px;border-radius:6px;border:2px solid #464c58;background:#14161b;color:#fff;font-size:14px;margin:10px 0;outline:none;}
</style>
</head>
<body>

<div id="app">

  <!-- REGISTER SCREEN -->
  <div class="screen" id="screen-reg">
    <div class="panel-card" style="text-align:center;">
      <div class="panel-title">🏭 工員登録（初回のみ）</div>
      <div style="font-size:12px;color:#ccc;">重複できない一意のプレイヤー名を登録してください。</div>
      <input type="text" id="reg-name-input" placeholder="名前を入力 (10文字以内)" maxlength="10">
      <button class="btn" id="btn-do-reg">登録して工場へ</button>
    </div>
  </div>

  <!-- START SCREEN -->
  <div class="screen hidden" id="screen-start">
    <div class="panel-card" style="text-align:center;">
      <div style="font-family:var(--font-d);color:var(--orange);font-size:28px;margin-bottom:4px;">WORD FACTORY</div>
      <div style="font-size:11px;color:#aaa;margin-bottom:12px;" id="user-display-info">工員: --- | 称号: [なし]</div>
      <div style="font-size:16px;font-family:var(--font-d);color:var(--yellow);margin-bottom:16px;" id="start-wallet">本日稼いだお金: ¥0</div>
      
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <button class="btn" id="btn-start-game" style="grid-column:span 2;">▶ 操業開始 (10問)</button>
        <button class="btn secondary" id="btn-open-col">📖 コレクション</button>
        <button class="btn secondary" id="btn-open-shop">🏪 購買部 (¥1000)</button>
        <button class="btn secondary" id="btn-open-rank" style="grid-column:span 2;">🏆 本日の売上ランキング</button>
      </div>
    </div>
  </div>

  <!-- GAME SCREEN -->
  <div class="screen hidden" id="screen-game">
    <div class="hud">
      <div class="gauge"><div class="gauge-label">獲得金</div><div class="gauge-value" id="hud-money">¥0</div></div>
      <div class="gauge"><div class="gauge-label">COMBO</div><div class="gauge-value" id="hud-combo">x0</div></div>
      <div class="gauge"><div class="gauge-label">難易度LV</div><div class="gauge-value" id="hud-diff">1</div></div>
      <div class="gauge"><div class="gauge-label">PROGRESS</div><div class="gauge-value" id="hud-prog">1/10</div></div>
    </div>

    <div class="order-slip">
      <div class="order-jp" id="order-jp">...</div>
      <div class="order-stats" id="order-stats">正解率: --% (0/0)</div>
    </div>

    <div class="slots" id="slots"></div>

    <div class="belt-wrap">
      <div class="belt-track"></div>
      <div class="tile-container" id="tile-container"></div>
    </div>
  </div>

  <!-- COLLECTION SCREEN -->
  <div class="screen hidden" id="screen-col">
    <div class="panel-card">
      <div class="panel-title">📖 コレクションノート</div>
      <div class="tab-row">
        <button class="tab-btn active" id="tab-btn-items">アイテム・称号 (54)</button>
        <button class="tab-btn" id="tab-btn-words">単語図鑑 (100)</button>
      </div>
      <div class="grid-container" id="col-grid"></div>
      <button class="btn secondary" style="margin-top:10px;" id="btn-col-back">もどる</button>
    </div>
  </div>

  <!-- SHOP / GACHA SCREEN -->
  <div class="screen hidden" id="screen-shop">
    <div class="panel-card" style="text-align:center;">
      <div class="panel-title">🏪 工場購買部</div>
      <div style="font-size:12px;color:#ccc;margin-bottom:12px;">1回 <b>¥1,000</b> でパーツや称号を獲得！</div>
      <div style="font-size:56px;margin:16px 0;" id="gacha-anim">🎁</div>
      <button class="btn" id="btn-draw-gacha">ガチャを引く (¥1000)</button>
      <button class="btn secondary" style="margin-top:10px;" id="btn-shop-back">もどる</button>
    </div>
  </div>

  <!-- RANKING SCREEN -->
  <div class="screen hidden" id="screen-rank">
    <div class="panel-card">
      <div class="panel-title">🏆 本日の売上ランキング</div>
      <div style="font-size:10px;color:#aaa;text-align:center;margin-bottom:8px;">※3分キャッシュ自動更新</div>
      <div class="grid-container" id="rank-list" style="display:block;"></div>
      <button class="btn secondary" style="margin-top:10px;" id="btn-rank-back">もどる</button>
    </div>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay hidden" id="modal">
    <div class="modal-card">
      <div style="font-size:36px;" id="modal-icon">❓</div>
      <div style="font-size:15px;font-weight:700;color:var(--paper);margin:4px 0;" id="modal-title">---</div>
      <div style="font-size:11px;color:var(--yellow);margin-bottom:8px;" id="modal-sub">---</div>
      <div style="font-size:11px;color:#bbb;margin-bottom:14px;" id="modal-desc">---</div>
      <div id="modal-actions" style="display:flex;flex-direction:column;gap:6px;"></div>
    </div>
  </div>

</div>

<!-- Firebase SDKs (v10+ Web Modules) -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { 
  getFirestore, doc, getDoc, setDoc, updateDoc, runTransaction, 
  collection, query, orderBy, limit, getDocs 
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

/* =================================================================
   1. FIREBASE CONFIG & INITIALIZATION
================================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyCRWTxhEN-v4Tvvgbv0J6XmhqglIVLkXoU",
  authDomain: "e-go-3cd93.firebaseapp.com",
  projectId: "e-go-3cd93",
  storageBucket: "e-go-3cd93.firebasestorage.app",
  messagingSenderId: "1028542275263",
  appId: "1:1028542275263:web:3e02c15a43c971a28db00a",
  measurementId: "G-E9WT8H41WQ"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* =================================================================
   2. MASTER DATA (100 Words [7 Level Split] & 54 Items)
================================================================= */
// [word, jp, level(1-7)]
const WORD_BANK = [
  // Lv1 (簡単/短文)
  ["cat","猫",1],["dog","犬",1],["egg","卵",1],["book","本",1],["door","ドア",1],["apple","りんご",1],["house","家",1],["water","水",1],["sky","空",1],["paper","紙",1],["river","川",1],["city","都市",1],["time","時間",1],["year","年",1],
  // Lv2
  ["friend","友達",2],["music","音楽",2],["school","学校",2],["window","窓",2],["country","国",2],["earth","地球",2],["future","未来",2],["history","歴史",2],["nature","自然",2],["space","宇宙",2],["story","物語",2],["same","同じ",2],["soon","すぐに",2],["tall","背が高い",2],
  // Lv3
  ["arrive","到着する",3],["will","～でしょう",3],["excited","ワクワクした",3],["find","見つける",3],["area","地域",3],["speech","スピーチ",3],["if","もし～なら",3],["forget","忘れる",3],["thick","分厚い",3],["early","早い",3],["change","変化する",3],["flight","飛行便",3],["airport","空港",3],["meter","メートル",3],
  // Lv4
  ["experience","経験",4],["actually","実は",4],["holiday","休日",4],["language","言語",4],["culture","文化",4],["foreign","外国の",4],["seafood","海鮮",4],["weigh","重さがある",4],["ton","トン",4],["dollar","ドル",4],["painting","絵画",4],["wall","壁",4],["surprised","驚いた",4],["order","注文する",4],
  // Lv5
  ["reservation","予約",5],["communicate","意思疎通する",5],["especially","特に",5],["topping","トッピング",5],["flavor","味",5],["salt","塩",5],["add","加える",5],["butter","バター",5],["climate","気候",5],["life","生活",5],["creativity","創造性",5],["chef","シェフ",5],["create","創造する",5],["sauce","ソース",5],
  // Lv6
  ["traveler","旅行者",6],["resident","住民",6],["menu","メニュー",6],["world","世界",6],["interesting","面白い",6],["enjoy","楽しむ",6],["different","異なる",6],["English","英語",6],["leave","出発する",6],["family","家族",6],["brother","兄弟",6],["open","開く",6],["breakfast","朝食",6],["people","人々",6],
  // Lv7 (長熟語・応用)
  ["know","知っている",7],["by the way","ところで",7],["for example","例えば",7],["and so on","～など",7],["be interested in","興味がある",7],["come from","出身である",7],["here is","ここに～がある",7],["see you","またね",7],["there is","～が存在する",7],["get up","起きる",7],["a lot of","たくさんの",7],["take care of","世話をする",7],["listen to","聴く",7],["look at","見る",7],["wait for","待つ",7],["thanks to","～のおかげで",7]
];

// 54 Items (Title: 6, Item: 48)
const ITEM_BANK = [];
const titleNames = ['見習い工員','一人前工員','スピードスター','コンボマスター','単語博士','工場長'];
for(let i=1; i<=6; i++){
  ITEM_BANK.push({ id: 'title_'+i, name: titleNames[i-1], type: 'title', icon: '🏅', desc: 'プロファイルに装着できる特別な称号。' });
}
const itemIcons = ['⚙️','🔧','🔨','🔩','📦','💡','💎','🏆','📜','🎨','🤖','🚀'];
for(let i=1; i<=48; i++){
  ITEM_BANK.push({ id: 'item_'+i, name: '工場パーツ #'+i, type: 'item', icon: itemIcons[(i-1)%itemIcons.length], desc: '工場の稼働率をあげる精密パーツ。' });
}

/* =================================================================
   3. LOCAL STATE & FIRESTORE SYNC
================================================================= */
let currentUser = null; // { name, equippedTitle, dailyMoney, lastActiveDate, items: { id: { count, giftable } }, wordStats: { word: { c, t } } }

function getTodayStr(){ return new Date().toISOString().split('T')[0]; }

async function loadUserData(username){
  const ref = doc(db, "users", username);
  const snap = await getDoc(ref);
  const today = getTodayStr();

  if(snap.exists()){
    currentUser = snap.data();
    // 日付跨ぎチェック
    if(currentUser.lastActiveDate !== today){
      currentUser.dailyMoney = 0;
      currentUser.lastActiveDate = today;
      await updateDoc(ref, { dailyMoney: 0, lastActiveDate: today });
    }
  } else {
    // 新規作成
    currentUser = {
      name: username,
      equippedTitle: 'title_1',
      dailyMoney: 0,
      lastActiveDate: today,
      items: { 'title_1': { count: 1, giftable: 1 }, 'item_1': { count: 1, giftable: 1 } },
      wordStats: {}
    };
    await setDoc(ref, currentUser);
  }
  localStorage.setItem('wf_username', username);
  checkIncomingPresents();
}

async function saveUserData(){
  if(!currentUser) return;
  const ref = doc(db, "users", currentUser.name);
  await setDoc(ref, currentUser, { merge: true });
}

/* =================================================================
   4. INCOMING PRESENTS (サーバーレスP2P/Firestore受取箱)
================================================================= */
async function checkIncomingPresents(){
  if(!currentUser) return;
  const q = collection(db, "users", currentUser.name, "presents");
  const snap = await getDocs(q);
  
  for(const pDoc of snap.docs){
    const pData = pDoc.data();
    const itemId = pData.itemId;
    
    // パターンA: 自分のコレクションストックを追加（giftableも+1）
    if(!currentUser.items[itemId]) currentUser.items[itemId] = { count: 0, giftable: 0 };
    currentUser.items[itemId].count += 1;
    currentUser.items[itemId].giftable += 1;
    
    alert(`🎁 プレイヤー [${pData.from}] から【${pData.itemName}】が届きました！`);
    // プレゼント受取削除
    await runTransaction(db, async (tx) => { tx.delete(pDoc.ref); });
  }
  saveUserData();
  updateUI();
}

/* =================================================================
   5. UI CONTROLLER & SCREEN NAVIGATION
================================================================= */
const screens = {
  reg: document.getElementById('screen-reg'),
  start: document.getElementById('screen-start'),
  game: document.getElementById('screen-game'),
  col: document.getElementById('screen-col'),
  shop: document.getElementById('screen-shop'),
  rank: document.getElementById('screen-rank')
};

function showScreen(name){
  Object.values(screens).forEach(s => s.classList.add('hidden'));
  screens[name].classList.remove('hidden');
  updateUI();
}

function updateUI(){
  if(!currentUser) return;
  const titleObj = ITEM_BANK.find(i => i.id === currentUser.equippedTitle);
  document.getElementById('user-display-info').textContent = `工員: ${currentUser.name} | 称号: [${titleObj ? titleObj.name : 'なし'}]`;
  document.getElementById('start-wallet').textContent = `本日の売上金: ¥${currentUser.dailyMoney.toLocaleString()}`;
}

/* =================================================================
   6. GAME LOGIC (出題アルゴリズム & バイクコンベア)
================================================================= */
let game = {
  round: 0, money: 0, combo: 0, level: 1, currentWord: null,
  recentWords: [], currentSlots: [], spawnedTiles: []
};

function startQuizGame(){
  game.round = 0; game.money = 0; game.combo = 0; game.level = 1; game.recentWords = [];
  showScreen('game');
  nextRound();
}

function selectNextWord(){
  // 1. 直近3問を除外
  const pool = WORD_BANK.filter(w => !game.recentWords.includes(w[0]));

  // 2. 正解率0%（未回答）または弱点単語の重み付け
  const candidates = pool.map(w => {
    const stat = currentUser.wordStats[w[0]];
    const rate = stat && stat.t > 0 ? (stat.c / stat.t) : 0; // 未回答は0%
    const levelDiff = Math.abs(w[2] - game.level);
    // 重み計算: 低正解率 ＋ 現在ゲームレベルに近い難易度
    const weight = (1.1 - rate) * 50 + (7 - levelDiff) * 10;
    return { word: w, weight: Math.max(1, weight) };
  });

  // 重み付け抽選
  let totalWeight = candidates.reduce((a, b) => a + b.weight, 0);
  let random = Math.random() * totalWeight;
  for(let c of candidates){
    if(random < c.weight) return c.word;
    random -= c.weight;
  }
  return pool[0];
}

function nextRound(){
  if(game.round >= 10){
    alert(`🎉 操業終了！本日のおかね +¥${game.money.toLocaleString()} を獲得しました！`);
    currentUser.dailyMoney += game.money;
    saveUserData();
    showScreen('start');
    return;
  }

  game.round++;
  document.getElementById('hud-prog').textContent = `${game.round}/10`;
  document.getElementById('hud-money').textContent = `¥${game.money.toLocaleString()}`;
  document.getElementById('hud-combo').textContent = `x${game.combo}`;
  document.getElementById('hud-diff').textContent = game.level;

  const wData = selectNextWord();
  game.currentWord = wData;
  game.recentWords.push(wData[0]);
  if(game.recentWords.length > 3) game.recentWords.shift();

  // 日本語表示 & スタッツ
  document.getElementById('order-jp').textContent = wData[1];
  const stat = currentUser.wordStats[wData[0]] || { c:0, t:0 };
  const rateStr = stat.t > 0 ? Math.round((stat.c/stat.t)*100) : 0;
  document.getElementById('order-stats').textContent = `正解率: ${rateStr}% (${stat.c}/${stat.t})`;

  // スロット生成（空白・スペース対応）
  const slotsContainer = document.getElementById('slots');
  slotsContainer.innerHTML = '';
  game.currentSlots = [];
  const targetChars = wData[0].split('');

  targetChars.forEach(char => {
    const s = document.createElement('div');
    s.className = 'slot' + (char === ' ' ? ' filled' : '');
    s.textContent = char === ' ' ? ' ' : '';
    slotsContainer.appendChild(s);
    game.currentSlots.push({ char: char, filled: char === ' ' });
  });

  spawnTiles(wData[0]);
}

function spawnTiles(wordStr){
  const container = document.getElementById('tile-container');
  container.innerHTML = '';
  game.spawnedTiles = [];

  // 必要な文字 + ランダミーダミー文字
  let chars = wordStr.replace(/ /g, '').split('');
  const dummyCount = Math.max(3, 8 - chars.length);
  const alphabet = "abcdefghijklmnopqrstuvwxyz";
  for(let i=0; i<dummyCount; i++){
    chars.push(alphabet[Math.floor(Math.random()*alphabet.length)]);
  }
  // シャッフル
  chars.sort(() => Math.random() - 0.5);

  const containerWidth = container.clientWidth || 360;
  chars.forEach((char, idx) => {
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.textContent = char;
    // 等間隔にコンベア上に配置
    const leftPos = (idx * 60) % (containerWidth - 50);
    tile.style.left = leftPos + 'px';

    tile.onclick = () => onTileClick(tile, char);
    container.appendChild(tile);
  });
}

function onTileClick(tileElem, char){
  // 次の未入力スロットを探す
  const nextSlotIdx = game.currentSlots.findIndex(s => !s.filled);
  if(nextSlotIdx === -1) return;

  const expectedChar = game.currentSlots[nextSlotIdx].char.toLowerCase();
  if(char.toLowerCase() === expectedChar){
    // 正解文字
    game.currentSlots[nextSlotIdx].filled = true;
    const slotsUI = document.getElementById('slots').children;
    slotsUI[nextSlotIdx].textContent = game.currentSlots[nextSlotIdx].char;
    slotsUI[nextSlotIdx].classList.add('filled');
    tileElem.style.display = 'none';

    // クリア判定
    if(game.currentSlots.every(s => s.filled)){
      onWordComplete(true);
    }
  } else {
    // お手つき（コンボリセット）
    game.combo = 0;
    document.getElementById('hud-combo').textContent = 'x0';
    tileElem.style.background = '#ff4757';
    setTimeout(() => tileElem.style.background = '', 300);
  }
}

function onWordComplete(success){
  const w = game.currentWord[0];
  if(!currentUser.wordStats[w]) currentUser.wordStats[w] = { c:0, t:0 };
  currentUser.wordStats[w].t += 1;

  if(success){
    currentUser.wordStats[w].c += 1;
    game.combo++;
    const reward = 100 + (game.combo * 20);
    game.money += reward;

    // 連続正解でゲーム内難易度上昇
    if(game.combo % 2 === 0 && game.level < 7) game.level++;
  }

  setTimeout(nextRound, 800);
}

/* =================================================================
   7. COLLECTION NOTEBOOK & GACHA
================================================================= */
let currentColTab = 'items';
document.getElementById('tab-btn-items').onclick = () => { currentColTab='items'; updateColUI(); };
document.getElementById('tab-btn-words').onclick = () => { currentColTab='words'; updateColUI(); };

function updateColUI(){
  document.getElementById('tab-btn-items').classList.toggle('active', currentColTab==='items');
  document.getElementById('tab-btn-words').classList.toggle('active', currentColTab==='words');
  const grid = document.getElementById('col-grid');
  grid.innerHTML = '';

  if(currentColTab === 'items'){
    ITEM_BANK.forEach(item => {
      const uItem = currentUser.items[item.id] || { count: 0, giftable: 0 };
      const isOwned = uItem.count > 0;

      const card = document.createElement('div');
      card.className = 'item-card ' + (isOwned ? '' : 'locked');
      card.innerHTML = `
        <div class="item-icon">${item.icon}</div>
        <div class="item-name">${isOwned ? item.name : '？？？？'}</div>
        <div class="item-count">${isOwned ? '所持:'+uItem.count+' (贈答可:'+uItem.giftable+')' : '未所持'}</div>
      `;
      card.onclick = () => openItemModal(item, uItem);
      grid.appendChild(card);
    });
  } else {
    WORD_BANK.forEach(([word, jp]) => {
      const stat = currentUser.wordStats[word];
      const isLearned = stat && stat.t > 0;
      const rate = isLearned ? Math.round((stat.c/stat.t)*100) : 0;

      const card = document.createElement('div');
      card.className = 'item-card ' + (isLearned ? '' : 'locked');
      card.innerHTML = `
        <div class="item-icon">${isLearned ? '🔤' : '❓'}</div>
        <div class="item-name">${isLearned ? word : '？？？'}</div>
        <div class="item-count">${isLearned ? jp+' ('+rate+'%)' : '未習得'}</div>
      `;
      grid.appendChild(card);
    });
  }
}

function openItemModal(item, uItem){
  const isOwned = uItem.count > 0;
  document.getElementById('modal-icon').textContent = isOwned ? item.icon : '❓';
  document.getElementById('modal-title').textContent = isOwned ? item.name : '未所持アイテム';
  document.getElementById('modal-sub').textContent = item.type === 'title' ? '【称号】' : '【工場パーツ】';
  document.getElementById('modal-desc').textContent = isOwned ? item.desc : 'ガチャや操業で獲得できます。';

  const actions = document.getElementById('modal-actions');
  actions.innerHTML = '';

  if(isOwned){
    if(item.type === 'title'){
      const btnEq = document.createElement('button');
      btnEq.className = 'btn';
      btnEq.textContent = currentUser.equippedTitle === item.id ? '装着中' : '称号をセット';
      btnEq.onclick = () => {
        currentUser.equippedTitle = item.id;
        saveUserData();
        closeModal();
        updateUI();
      };
      actions.appendChild(btnEq);
    }

    // パターンA: giftableCount > 0 のみ送信可能
    if(uItem.giftable > 0){
      const btnGift = document.createElement('button');
      btnGift.className = 'btn purple';
      btnGift.textContent = `🎁 他の工員に贈る (残り:${uItem.giftable}回)`;
      btnGift.onclick = () => { closeModal(); showScreen('rank'); };
      actions.appendChild(btnGift);
    }
  }

  const btnClose = document.createElement('button');
  btnClose.className = 'btn secondary';
  btnClose.textContent = '閉じる';
  btnClose.onclick = closeModal;
  actions.appendChild(btnClose);

  document.getElementById('modal').classList.remove('hidden');
}

function closeModal(){ document.getElementById('modal').classList.add('hidden'); }

// ガチャ (¥1,000)
document.getElementById('btn-draw-gacha').onclick = async () => {
  if(currentUser.dailyMoney < 1000){
    alert('本日のおかねが足りません！(¥1,000必要)');
    return;
  }
  const btn = document.getElementById('btn-draw-gacha');
  btn.disabled = true;

  currentUser.dailyMoney -= 1000;
  
  // ガチャ抽せん（未所持優先）
  const unowned = ITEM_BANK.filter(i => !currentUser.items[i.id] || currentUser.items[i.id].count === 0);
  const picked = unowned.length > 0 ? unowned[Math.floor(Math.random()*unowned.length)] : ITEM_BANK[Math.floor(Math.random()*ITEM_BANK.length)];

  if(!currentUser.items[picked.id]) currentUser.items[picked.id] = { count: 0, giftable: 0 };
  currentUser.items[picked.id].count += 1;
  currentUser.items[picked.id].giftable += 1; // 1回につき1回送信権獲得

  await saveUserData();
  updateUI();
  btn.disabled = false;

  alert(`🎉 ガチャ獲得: 【${picked.name}】を入手しました！(プレゼント可能数 +1)`);
};

/* =================================================================
   8. RANKING & PRESENT TRANSACTION
================================================================= */
let rankingCache = { data: null, time: 0 };

async function loadRanking(){
  const listEl = document.getElementById('rank-list');
  listEl.innerHTML = '<div style="color:#aaa;text-align:center;">読み込み中...</div>';

  const now = Date.now();
  if(rankingCache.data && (now - rankingCache.time < 180000)){ // 3分キャッシュ
    renderRankingList(rankingCache.data);
    return;
  }

  try {
    const q = query(collection(db, "users"), orderBy("dailyMoney", "desc"), limit(30));
    const snap = await getDocs(q);
    const data = snap.docs.map(d => d.data());
    rankingCache = { data: data, time: now };
    renderRankingList(data);
  } catch(e) {
    listEl.innerHTML = '<div style="color:#ff4757;text-align:center;">ランキング取得エラー</div>';
  }
}

function renderRankingList(data){
  const listEl = document.getElementById('rank-list');
  listEl.innerHTML = '';

  data.forEach((u, idx) => {
    const tObj = ITEM_BANK.find(i => i.id === u.equippedTitle);
    const item = document.createElement('div');
    item.className = 'ranking-item';
    item.innerHTML = `
      <div class="rank-num">#${idx+1}</div>
      <div class="rank-info">
        <div class="rank-name">${u.name}</div>
        <div class="rank-title">[${tObj ? tObj.name : 'なし'}]</div>
      </div>
      <div class="rank-val">¥${(u.dailyMoney||0).toLocaleString()}</div>
    `;

    // プレゼント対象選択（自分以外）
    if(u.name !== currentUser.name){
      item.style.cursor = 'pointer';
      item.onclick = () => promptGiftItem(u.name);
    }
    listEl.appendChild(item);
  });
}

async function promptGiftItem(targetName){
  // プレゼント可能なアイテムの一覧
  const giftables = ITEM_BANK.filter(i => currentUser.items[i.id] && currentUser.items[i.id].giftable > 0);
  if(giftables.length === 0){
    alert('プレゼント可能なアイテムを所持していません。');
    return;
  }

  const names = giftables.map((g, idx) => `${idx+1}. ${g.name} (残:${currentUser.items[g.id].giftable})`).join('\n');
  const sel = prompt(`工員 [${targetName}] に送るアイテムの番号を入力してください:\n${names}`);
  const idx = parseInt(sel) - 1;

  if(!isNaN(idx) && giftables[idx]){
    const item = giftables[idx];
    
    // トランザクション処理でプレゼント送信
    try {
      await runTransaction(db, async (tx) => {
        // 相手のpresentsサブコレクションにメッセージ追加
        const presRef = doc(collection(db, "users", targetName, "presents"));
        tx.set(presRef, {
          from: currentUser.name,
          itemId: item.id,
          itemName: item.name,
          date: Date.now()
        });
      });

      // パターンA: 自分リストの所持数(count)は減らさず、giftableのみ-1
      currentUser.items[item.id].giftable -= 1;
      await saveUserData();
      alert(`【${item.name}】を工員 [${targetName}] にプレゼントしました！`);
      showScreen('start');
    } catch(e) {
      alert('送信処理に失敗しました。');
    }
  }
}

================================================================= */
document.getElementById('btn-do-reg').onclick = async () => {
  const name = document.getElementById('reg-name-input').value.trim();
  if(!name){ alert('名前を入力してください。'); return; }

  // ドキュメントIDでの重複判定
  const ref = doc(db, "users", name);
  const snap = await getDoc(ref);
  if(snap.exists()){
    alert('その名前は既に使用されています。別の名前を入力してください。');
    return;
  }

  await loadUserData(name);
  showScreen('start');
};
