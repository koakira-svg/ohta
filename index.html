<style>
:root{
  --steel-900:#14161b; --steel-800:#1d2027; --steel-700:#2a2e37; --steel-600:#3a3f4a; --steel-500:#565d6b;
  --yellow:#ffc72c; --yellow-dark:#c99400; --orange:#ff6a3d; --blue:#4fa3d1; --green:#3ddc84; --red:#ff4757; --purple:#a855f7;
  --paper:#f4ecd8;
  --font-d:'Archivo Black', 'Noto Sans JP', sans-serif;
  --font-b:'Noto Sans JP', sans-serif;
  --font-m:'Space Mono', monospace;
}
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  -webkit-user-select:none;
  touch-action: manipulation;
}
html,body{
  margin:0;padding:0;height:100vh;height:100dvh;
  background:var(--steel-900);font-family:var(--font-b);
  overflow:hidden;
  overscroll-behavior: none;
}
#app{position:relative;z-index:1;width:100%;height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;}

/* Screens & Layout */
.screen{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:12px;}
.hidden{display:none !important;}
button{font-family:var(--font-d);cursor:pointer;border:none;outline:none;}
.btn{
  font-family:var(--font-d); color:#1c1c1c; background:linear-gradient(180deg, var(--yellow), var(--yellow-dark));
  padding:12px 24px; border-radius:10px; font-size:15px; letter-spacing:1px;
  box-shadow:0 4px 0 #8a6a00, 0 6px 12px rgba(0,0,0,0.4); border:2px solid #2a2010; transition:transform .08s ease;
  width: 100%;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8a6a00;}
.btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;box-shadow:none;}
.btn.secondary{background:linear-gradient(180deg, #6d7684, #3a3f4a); color:#f4ecd8; box-shadow:0 4px 0 #1c1e23; border-color:#1c1e23;}
.btn.purple{background:linear-gradient(180deg, #c084fc, #7e22ce); color:#fff; box-shadow:0 4px 0 #581c87; border-color:#3b0764;}

.panel-card{
  background:linear-gradient(180deg,#2a2e37,#1d2027); border:3px solid #464c58; border-radius:16px;
  padding:16px; box-shadow:0 10px 20px rgba(0,0,0,0.6); max-width:440px; width:100%; max-height:88vh; display:flex; flex-direction:column;
}
.panel-title{font-family:var(--font-b);font-weight:900;font-size:18px;color:var(--paper);text-align:center;margin-bottom:10px;}

/* Game HUD & Conveyor */
#screen-game{padding:8px;justify-content:flex-start;}
.hud{display:flex;justify-content:space-between;align-items:center;gap:4px;padding:8px;background:#1d2027;border:2px solid #464c58;border-radius:12px;width:100%;max-width:440px;}
.gauge{text-align:center;flex:1;}
.gauge-label{font-family:var(--font-m);font-size:9px;color:#8b909c;}
.gauge-value{font-family:var(--font-d);font-size:14px;color:var(--yellow);}

/* Timer Bar */
.timer-wrap{width:100%;max-width:440px;height:8px;background:#14161b;border:1px solid #464c58;border-radius:4px;margin-top:6px;overflow:hidden;position:relative;}
.timer-bar{height:100%;width:100%;background:linear-gradient(90deg, var(--green), var(--yellow), var(--red));transition:width 0.1s linear;}

.order-slip{margin:6px 0 4px;background:var(--paper);border-radius:8px;padding:10px 16px;transform:rotate(-1deg);box-shadow:0 4px 8px rgba(0,0,0,0.4);text-align:center;width:100%;max-width:440px;position:relative;}
.order-jp{font-size:22px;font-weight:900;color:#2a2010;}
.order-stats{font-size:10px;color:#7a6b52;margin-top:2px;}
.btn-speech{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:20px;cursor:pointer;}

.slots{display:flex;justify-content:center;align-items:center;gap:4px;padding:6px 0;min-height:56px;width:100%;flex-wrap:wrap;}
.slot{width:34px;height:44px;border:2px dashed #565d6b;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-size:20px;color:var(--paper);background:rgba(0,0,0,0.2);}
.slot.filled{border-style:solid;border-color:var(--green);background:#2a3530;}

.belt-wrap{position:relative;width:100%;max-width:440px;flex:1;margin-top:6px;border-radius:12px;overflow:hidden;border:3px solid #464c58;background:#1a1c21;min-height:200px;display:flex;align-items:center;justify-content:center;padding:12px;}
.belt-track{position:absolute;inset:0;background:repeating-linear-gradient(115deg, #34383f 0 20px, #131417 20px 40px);background-size:200% 100%;animation:beltmove 1.5s linear infinite;}
@keyframes beltmove{from{background-position:0 0;}to{background-position:-56.5px 0;}}

.tile-container{position:relative;z-index:2;width:100%;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px;max-height:100%;overflow-y:auto;}
.tile{
  width:60px; height:70px; background:linear-gradient(180deg,#e8dcc0,#c9b98d);
  border:3px solid #5a4a2a; border-radius:8px; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-d); font-size:32px; color:#2a2010; cursor:pointer; box-shadow:0 4px 8px rgba(0,0,0,0.4);
  transition:transform 0.1s; flex-shrink:0;
}
.tile:active{transform:scale(0.92);}

/* Collection & Lists */
.tab-row{display:flex;gap:6px;margin-bottom:10px;}
.tab-btn{flex:1;padding:8px;background:#3a3f4a;color:#aaa;border-radius:6px;font-size:11px;text-align:center;border:none;cursor:pointer;}
.tab-btn.active{background:var(--yellow);color:#1c1c1c;font-weight:700;}

.grid-container{overflow-y:auto;flex:1;display:grid;grid-template-columns:repeat(3, 1fr);gap:8px;padding:4px;}
.item-card{background:#14161b;border:2px solid #3a3f4a;border-radius:8px;padding:8px;text-align:center;position:relative;cursor:pointer;}
.item-card.locked{opacity:0.5;}
.item-card.locked .item-icon{filter:brightness(0) blur(2px);}
.item-num{font-family:var(--font-m);font-size:9px;color:var(--orange);margin-bottom:2px;}
.item-icon{font-size:26px;margin-bottom:2px;}
.item-name{font-size:10px;color:var(--paper);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item-count{font-size:9px;color:var(--yellow);}

.ranking-item{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:#14161b;border:1px solid #3a3f4a;border-radius:6px;margin-bottom:6px;}
.rank-num{font-family:var(--font-d);font-size:14px;color:var(--yellow);width:28px;}
.rank-info{flex:1;text-align:left;}
.rank-name{font-size:12px;color:var(--paper);font-weight:700;}
.rank-title{font-size:9px;color:var(--orange);}
.rank-val{font-family:var(--font-m);font-size:12px;color:var(--green);}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;}
.modal-card{background:#2a2e37;border:3px solid #464c58;border-radius:14px;padding:18px;max-width:360px;width:100%;text-align:center;max-height:85vh;display:flex;flex-direction:column;}
input[type="text"]{width:100%;padding:10px;border-radius:6px;border:2px solid #464c58;background:#14161b;color:#fff;font-size:14px;margin:10px 0;outline:none;}
</style>
</head>

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playCorrectSE() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const now = audioCtx.currentTime;
  const osc1 = audioCtx.createOscillator();
  const osc2 = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc1.type = 'sine'; osc2.type = 'sine';
  osc1.frequency.setValueAtTime(523.25, now);
  osc1.frequency.setValueAtTime(659.25, now + 0.08);
  osc2.frequency.setValueAtTime(783.99, now + 0.16);
  osc2.frequency.setValueAtTime(1046.50, now + 0.24);

  gain.gain.setValueAtTime(0.15, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);

  osc1.connect(gain); osc2.connect(gain);
  gain.connect(audioCtx.destination);

  osc1.start(now); osc1.stop(now + 0.4);
  osc2.start(now + 0.16); osc2.stop(now + 0.4);
}

function playIncorrectSE() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(150, now);
  osc.frequency.setValueAtTime(110, now + 0.15);

  gain.gain.setValueAtTime(0.2, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now); osc.stop(now + 0.35);
}

function speakWord(text) {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'en-US';
    utter.rate = 0.9;
    window.speechSynthesis.speak(utter);
  }
}

let currentUser = null;
let viewingUserData = null; 

function getTodayStr(){ return new Date().toISOString().split('T')[0]; }

async function loadUserData(username){
  const cleanName = username.trim().replace(/[\/\s]/g, '_');
  const ref = doc(db, "users", cleanName);
  const snap = await getDoc(ref);
  const today = getTodayStr();

  if(snap.exists()){
    currentUser = snap.data();
    if(currentUser.wallet === undefined) currentUser.wallet = currentUser.dailyMoney || 0;

    if(currentUser.lastActiveDate !== today){
      await checkAndRewardTopPlayer();
      currentUser.dailyMoney = 0;
      currentUser.lastActiveDate = today;
      await updateDoc(ref, { dailyMoney: 0, lastActiveDate: today });
    }
  } else {
    currentUser = {
      name: cleanName,
      equippedTitle: 'title_1',
      wallet: 0,
      dailyMoney: 0,
      lastActiveDate: today,
      items: { 'title_1': { count: 1, giftable: 1 }, 'item_1': { count: 1, giftable: 1 } },
      wordStats: {}
    };
    await setDoc(ref, currentUser);
  }
  localStorage.setItem('wf_username', cleanName);
  checkIncomingPresents();
}

async function checkAndRewardTopPlayer(){
  try {
    const q = query(collection(db, "users"), orderBy("dailyMoney", "desc"), limit(1));
    const snap = await getDocs(q);
    if(!snap.empty){
      const topUser = snap.docs[0].data();
      if(topUser.name === currentUser.name){
        const titles = ITEM_BANK.filter(i => i.type === 'title');
        const pickedTitle = titles[Math.floor(Math.random() * titles.length)];
        
        if(!currentUser.items[pickedTitle.id]) currentUser.items[pickedTitle.id] = { count: 0, giftable: 0 };
        currentUser.items[pickedTitle.id].count += 1;
        currentUser.items[pickedTitle.id].giftable += 1;

        alert(`👑 前日ランキング1位達成！\n特別称号【${pickedTitle.name}】を獲得しました！`);
      }
    }
  } catch(e) {
    console.error("1位報酬チェックエラー:", e);
  }
}

async function saveUserData(){
  if(!currentUser) return;
  const ref = doc(db, "users", currentUser.name);
  await setDoc(ref, currentUser, { merge: true });
}

async function checkIncomingPresents(){

}

/* =================================================================
   7. GAME LOGIC & TIMER & SPEED BONUS (Per Question Bonus)
================================================================= */
let game = {
  round: 0, money: 0, totalSpeedBonus: 0, combo: 0, level: 1, currentWord: null,
  recentWords: [], currentSlots: [], missCount: 0,
  questionStartTime: 0, timerInterval: null, timeLeft: 15
};

const QUESTION_TIMEOUT_SEC = 15; // 1問あたりの制限時間(秒)

function startQuizGame(){
  game.round = 0; 
  game.money = 0; 
  game.totalSpeedBonus = 0;
  game.combo = 0; 
  game.level = 1; 
  game.recentWords = [];
  showScreen('game');
  nextRound();
}

function startTimer() {
  stopTimer();
  game.timeLeft = QUESTION_TIMEOUT_SEC;
  game.questionStartTime = Date.now();
  updateTimerUI();

  game.timerInterval = setInterval(() => {
    const elapsed = (Date.now() - game.questionStartTime) / 1000;
    game.timeLeft = Math.max(0, QUESTION_TIMEOUT_SEC - elapsed);
    updateTimerUI();

    if (game.timeLeft <= 0) {
      stopTimer();
      onTimeOut();
    }
  }, 100);
}

function stopTimer() {
  if (game.timerInterval) {
    clearInterval(game.timerInterval);
    game.timerInterval = null;
  }
}

function updateTimerUI() {
  const bar = document.getElementById('timer-bar');
  const pct = (game.timeLeft / QUESTION_TIMEOUT_SEC) * 100;
  bar.style.width = `${pct}%`;
}

function onTimeOut() {
  playIncorrectSE();
  game.combo = 0;
  game.missCount++;
  document.getElementById('hud-combo').textContent = 'x0';
  document.getElementById('hud-miss').textContent = `${game.missCount}/3`;

  setTimeout(() => {
    alert(`⏰ 制限時間切れ！正解は「${game.currentWord[0]}」でした。次の問題へ進みます。`);
    onWordComplete(false);
  }, 100);
}

function selectNextWord(){
  const pool = WORD_BANK.filter(w => !game.recentWords.includes(w[0]));

  const candidates = pool.map(w => {
    const stat = currentUser.wordStats[w[0]];
    const correctCount = stat ? stat.c : 0;
    const levelDiff = Math.abs(w[2] - game.level);
    const weight = Math.max(1, (5 - correctCount) * 10 + (7 - levelDiff) * 5);
    return { word: w, weight: weight };
  });

  let totalWeight = candidates.reduce((a, b) => a + b.weight, 0);
  let random = Math.random() * totalWeight;
  for(let c of candidates){
    if(random < c.weight) return c.word;
    random -= c.weight;
  }
  return pool[0];
}

function nextRound(){
  stopTimer();

  if(game.round >= 10){
    const totalEarned = game.money;

    alert(`🎉 操業終了！\n\n・問題獲得報酬: ¥${(game.money - game.totalSpeedBonus).toLocaleString()}\n・タイムボーナス合計: ¥${game.totalSpeedBonus.toLocaleString()}\n---------------------\n合計獲得金額：¥${totalEarned.toLocaleString()}`);

    currentUser.wallet = (currentUser.wallet || 0) + totalEarned;
    currentUser.dailyMoney = (currentUser.dailyMoney || 0) + totalEarned;
    saveUserData();
    showScreen('start');
    return;
  }

  game.round++;
  game.missCount = 0;
  document.getElementById('hud-prog').textContent = `${game.round}/10`;
  document.getElementById('hud-money').textContent = `¥${game.money.toLocaleString()}`;
  document.getElementById('hud-combo').textContent = `x${game.combo}`;
  document.getElementById('hud-miss').textContent = `0/3`;

  const wData = selectNextWord();
  game.currentWord = wData;
  game.recentWords.push(wData[0]);
  if(game.recentWords.length > 3) game.recentWords.shift();

  document.getElementById('order-jp').textContent = wData[1];
  const stat = currentUser.wordStats[wData[0]] || { c:0, t:0 };
  const profLabel = getProficiencyLabel(stat.c);
  document.getElementById('order-stats').textContent = `習熟度: ${profLabel}`;

  speakWord(wData[0]);
  document.getElementById('btn-speech').onclick = () => speakWord(wData[0]);

  const slotsContainer = document.getElementById('slots');
  slotsContainer.innerHTML = '';
  game.currentSlots = [];
  const targetChars = wData[0].split('');

  targetChars.forEach(char => {
    const s = document.createElement('div');
    s.className = 'slot' + (char === ' ' ? ' filled' : '');
    s.textContent = char === ' ' ? ' ' : '';
    slotsContainer.appendChild(s);
    game.currentSlots.push({ char: char, filled: char === ' ' });
  });

  requestAnimationFrame(() => {
    spawnTiles(wData[0]);
    startTimer();
  });
}

function spawnTiles(wordStr){
  const container = document.getElementById('tile-container');
  container.innerHTML = '';

  let chars = wordStr.replace(/ /g, '').split('');
  chars.sort(() => Math.random() - 0.5);

  chars.forEach((char) => {
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.textContent = char;
    tile.onclick = () => onTileClick(tile, char);
    container.appendChild(tile);
  });
}

function onTileClick(tileElem, char){
  const nextSlotIdx = game.currentSlots.findIndex(s => !s.filled);
  if(nextSlotIdx === -1) return;

  const expectedChar = game.currentSlots[nextSlotIdx].char.toLowerCase();
  
  if(char.toLowerCase() === expectedChar){
    playCorrectSE();
    game.currentSlots[nextSlotIdx].filled = true;
    const slotsUI = document.getElementById('slots').children;
    slotsUI[nextSlotIdx].textContent = game.currentSlots[nextSlotIdx].char;
    slotsUI[nextSlotIdx].classList.add('filled');
    tileElem.style.visibility = 'hidden';

    if(game.currentSlots.every(s => s.filled)){
      stopTimer();
      onWordComplete(true);
    }
  } else {
    playIncorrectSE();
    game.combo = 0;
    game.missCount++;
    document.getElementById('hud-combo').textContent = 'x0';
    document.getElementById('hud-miss').textContent = `${game.missCount}/3`;

    tileElem.style.borderColor = 'var(--red)';
    setTimeout(() => tileElem.style.borderColor = '#5a4a2a', 300);

    if(game.missCount >= 3){
      stopTimer();
      setTimeout(() => {
        alert(`❌ 3回間違えました！正解は「${game.currentWord[0]}」でした。次の問題へ進みます。`);
        onWordComplete(false);
      }, 200);
    }
  }
}

function onWordComplete(success){
  const w = game.currentWord[0];
  if(!currentUser.wordStats[w]) currentUser.wordStats[w] = { c:0, t:0 };
  currentUser.wordStats[w].t += 1;

  if(success){
    currentUser.wordStats[w].c += 1;
    game.combo++;

    const elapsedSec = (Date.now() - game.questionStartTime) / 1000;
    const speedBonus = Math.max(0, Math.floor(150 - (elapsedSec * 10)));

    const baseReward = 100 + (game.combo * 20);
    const totalReward = baseReward + speedBonus;

    game.money += totalReward;
    game.totalSpeedBonus += speedBonus;

    if(game.combo % 2 === 0 && game.level < 7) game.level++;
  }

  setTimeout(nextRound, 600);
}

async function drawGachaProcess(times, cost) {
  if ((currentUser.wallet || 0) < cost) {
    alert(`所持金が足りません！(¥${cost.toLocaleString()} 必要)`);
    return;
  }

  currentUser.wallet -= cost;

  const partsPool = ITEM_BANK.filter(i => i.type === 'item');
  const results = [];

  for (let i = 0; i < times; i++) {
    const picked = partsPool[Math.floor(Math.random() * partsPool.length)];
    if (!currentUser.items[picked.id]) currentUser.items[picked.id] = { count: 0, giftable: 0 };
    currentUser.items[picked.id].count += 1;
    currentUser.items[picked.id].giftable += 1;
    results.push(picked.name);
  }

  await saveUserData();
  updateUI();

  if (times === 1) {
    alert(`🎉 ガチャ獲得: 【${results[0]}】を入手しました！`);
  } else {
    alert(`🎉 ${times}連ガチャ結果:\n・${results.join('\n・')}`);
  }
}

  actions.appendChild(btnViewCol);

  const btnGift = document.createElement('button');
  btnGift.className = 'btn purple';
  btnGift.textContent = '🎁 アイテムをプレゼント';
  btnGift.onclick = () => {
    closeModal();
    promptGiftItem(targetUserData.name);
  };
  actions.appendChild(btnGift);

  const btnClose = document.createElement('button');
  btnClose.className = 'btn secondary';
  btnClose.textContent = '閉じる';
  btnClose.onclick = closeModal;
  actions.appendChild(btnClose);

  document.getElementById('modal').classList.remove('hidden');
}

async function promptGiftItem(targetName){
  const giftables = ITEM_BANK.filter(i => currentUser.items[i.id] && currentUser.items[i.id].giftable > 0);
  if(giftables.length === 0){
    alert('プレゼント可能なアイテムを所持していません。');
    return;
  }

  const names = giftables.map((g, idx) => `${idx+1}. ${g.name} (残:${currentUser.items[g.id].giftable})`).join('\n');
  const sel = prompt(`工員 [${targetName}] に送るアイテムの番号を入力してください:\n${names}`);
  const idx = parseInt(sel) - 1;

  if(!isNaN(idx) && giftables[idx]){
    const item = giftables[idx];
    
    try {
      await runTransaction(db, async (tx) => {
        const presRef = doc(collection(db, "users", targetName, "presents"));
        tx.set(presRef, {
          from: currentUser.name,
          itemId: item.id,
          itemName: item.name,
          date: Date.now()
        });
      });

      currentUser.items[item.id].giftable -= 1;
      await saveUserData();
      alert(`【${item.name}】を工員 [${targetName}] にプレゼントしました！`);
      showScreen('start');
    } catch(e) {
      alert('送信処理に失敗しました。');
    }
  }
}

   10. INITIALIZATION & EVENTS
================================================================= */
document.getElementById('btn-do-reg').onclick = async () => {
  const nameInput = document.getElementById('reg-name-input').value.trim();
  if(!nameInput){ 
    alert('名前を入力してください。'); 
    return; 
  }

  const cleanName = nameInput.replace(/[\/\s]/g, '_');
  const btn = document.getElementById('btn-do-reg');
  btn.disabled = true;
  btn.textContent = '登録中...';

  try {
    const ref = doc(db, "users", cleanName);
    const snap = await getDoc(ref);
    if(snap.exists()){
      alert('その名前は既に使用されています。別の名前を入力してください。');
      btn.disabled = false;
      btn.textContent = '登録して工場へ';
      return;
    }

    await loadUserData(cleanName);
    showScreen('start');
  } catch(e) {
    console.error("登録エラー:", e);
    alert('登録処理に失敗しました:\n' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '登録して工場へ';
  }
};
