<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>英単語工場 | 100語クリアを目指せ</title>
<style>
  :root{
    --steel-dark:#171d24;
    --steel:#232c36;
    --steel-mid:#2f3a46;
    --steel-light:#3d4b59;
    --panel:#eee7d8;
    --panel-2:#f7f2e6;
    --rivet:#b9c3cc;
    --yellow:#ffc233;
    --yellow-dark:#c98e00;
    --rust:#d9642c;
    --ok:#3fae74;
    --ok-dim:rgba(63,174,116,0.18);
    --danger:#e2493d;
    --danger-dim:rgba(226,73,61,0.16);
    --ink:#1b222b;
    --ink-dim:#5c6773;
    --ink-faint:#8894a0;
    --font-display:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
    --font-body:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 20% -10%, rgba(255,194,51,0.10), transparent 45%),
      linear-gradient(180deg,var(--steel-dark),var(--steel) 40%,var(--steel-mid) 100%);
    color:var(--panel-2);
    font-family:var(--font-body);
    display:flex;
    justify-content:center;
    padding:18px 12px 50px;
    position:relative;
    overflow-x:hidden;
  }
  .stage{ position:relative; z-index:1; width:100%; max-width:460px; }
  h1,h2,h3{ font-family:var(--font-display); margin:0; }
  button{ font-family:var(--font-body); cursor:pointer; }

  /* ---------- hazard stripe utility ---------- */
  .hazard{
    background: repeating-linear-gradient(135deg, var(--yellow) 0 14px, var(--steel-dark) 14px 28px);
  }
  .hazard-bar{ height:6px; border-radius:3px; }

  /* ---------- screens ---------- */
  .screen{ display:none; }
  .screen.active{ display:block; animation: fadeIn .35s ease; }
  @keyframes fadeIn{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:translateY(0);} }

  /* ================= TITLE ================= */
  .plant{
    position:relative; height:190px; margin-bottom:6px;
    background: linear-gradient(180deg, #4a5a6b 0%, #2a3440 70%, #1c242d 100%);
    border-radius:14px; overflow:hidden;
    border:3px solid var(--steel-light);
    box-shadow: inset 0 -40px 50px -20px rgba(0,0,0,0.5);
  }
  .plant .sky-glow{ position:absolute; inset:0; background: radial-gradient(circle at 75% 20%, rgba(255,194,51,0.35), transparent 55%); }
  .stack{ position:absolute; bottom:34px; width:22px; background:#5b6a78; border:2px solid #1c242d; border-radius:3px 3px 0 0; }
  .stack.s1{ left:26px; height:78px; }
  .stack.s2{ left:58px; height:104px; }
  .stack.s3{ right:38px; height:64px; }
  .smoke{ position:absolute; width:16px; height:16px; border-radius:50%; background:rgba(230,230,230,0.55); filter:blur(1px); animation: smokeUp 4.5s linear infinite; }
  @keyframes smokeUp{
    0%{ transform:translate(0,0) scale(0.5); opacity:0; }
    15%{ opacity:.65; }
    100%{ transform:translate(14px,-140px) scale(2.1); opacity:0; }
  }
  .plant-building{ position:absolute; bottom:0; left:0; right:0; height:100px; background:#333f4c; border-top:3px solid var(--yellow); }
  .plant-building::before{
    content:""; position:absolute; top:-14px; left:0; right:0; height:14px;
    background: repeating-linear-gradient(90deg, var(--yellow) 0 16px, var(--steel-dark) 16px 32px);
  }
  .window{ position:absolute; bottom:18px; width:26px; height:34px; background:var(--yellow); opacity:.85; box-shadow:0 0 14px rgba(255,194,51,0.7); }
  .gear-deco{ position:absolute; font-size:46px; opacity:.16; animation: spin 14s linear infinite; }
  .gear-deco.g2{ font-size:30px; opacity:.14; animation-duration:9s; animation-direction:reverse; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .title-wrap{ text-align:center; padding:10px 4px 4px; }
  .title-eyebrow{ font-size:11px; letter-spacing:3px; color:var(--yellow); font-weight:700; }
  .title-main{ font-size:30px; font-weight:900; letter-spacing:1px; color:var(--panel-2); margin:4px 0 2px; text-shadow:0 2px 0 rgba(0,0,0,0.4); }
  .title-sub{ font-size:12.5px; color:var(--ink-faint); margin-bottom:14px; }

  .start-btn{
    display:block; width:100%; padding:16px; border:none; border-radius:12px;
    background: linear-gradient(180deg, var(--yellow), var(--yellow-dark));
    color:#241800; font-weight:900; font-size:17px; letter-spacing:1px;
    box-shadow: 0 6px 0 #8a6300, 0 10px 18px rgba(0,0,0,0.35);
    position:relative;
  }
  .start-btn:active{ transform:translateY(4px); box-shadow:0 2px 0 #8a6300, 0 4px 8px rgba(0,0,0,0.3); }
  .start-btn .rivets{ position:absolute; inset:6px 10px; border:2px dashed rgba(36,24,0,0.25); border-radius:8px; pointer-events:none; }

  .title-stats{ display:flex; gap:10px; margin-top:16px; }
  .stat-card{
    flex:1; background:var(--steel-mid); border:2px solid var(--steel-light); border-radius:10px;
    padding:10px 8px; text-align:center;
  }
  .stat-card .v{ font-size:18px; font-weight:900; color:var(--yellow); }
  .stat-card .l{ font-size:10.5px; color:var(--ink-faint); margin-top:2px; }

  .notebook-link{
    margin-top:12px; width:100%; padding:12px; border-radius:10px; border:2px solid var(--steel-light);
    background:var(--steel-mid); color:var(--panel-2); font-weight:700; font-size:13.5px;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .reset-link{ display:block; text-align:center; margin-top:16px; font-size:11px; color:var(--ink-faint); text-decoration:underline; background:none; border:none; }

  /* ================= HUD ================= */
  .hud{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .rank-badge{
    display:flex; align-items:center; gap:6px; padding:7px 10px; border-radius:10px;
    background:var(--steel-mid); border:2px solid var(--steel-light); font-size:11.5px; font-weight:800; color:var(--panel-2);
    white-space:nowrap;
  }
  .rank-badge .dot{ width:9px; height:9px; border-radius:50%; }
  .yen-badge{
    flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
    background: var(--panel); color:var(--ink); border-radius:10px; padding:7px 10px;
    border:2px solid var(--yellow-dark); font-weight:900; font-size:15px;
  }
  .streak-badge{
    display:flex; align-items:center; gap:4px; padding:7px 10px; border-radius:10px;
    background:var(--steel-mid); border:2px solid var(--steel-light); font-size:12.5px; font-weight:800; color:var(--yellow);
  }

  /* ================= QUESTION CARD ================= */
  .card{
    background:var(--panel); border-radius:16px; padding:22px 18px 20px; text-align:center;
    border:3px solid var(--steel-light); position:relative; box-shadow:0 10px 24px rgba(0,0,0,0.35);
  }
  .card::before, .card::after{ content:""; position:absolute; top:10px; width:9px; height:9px; border-radius:50%; background:var(--rivet); box-shadow: inset 0 1px 2px rgba(0,0,0,0.4); }
  .card::before{ left:10px; } .card::after{ right:10px; }
  .card-tag{ font-size:11px; font-weight:800; letter-spacing:2px; color:var(--ink-dim); margin-bottom:10px; }
  .prompt{ font-size:27px; font-weight:900; color:var(--ink); line-height:1.35; word-break:break-word; }
  .prompt.en{ font-family:Georgia,"Times New Roman",serif; letter-spacing:0.5px; }
  .speak-btn{
    margin-top:10px; display:inline-flex; align-items:center; gap:5px; border:none; background:var(--steel-mid);
    color:var(--panel-2); padding:6px 12px; border-radius:20px; font-size:12px; font-weight:700;
  }

  .choices{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px; }
  .choice-btn{
    padding:14px 8px; border-radius:12px; border:2px solid var(--steel-light); background:var(--steel-mid);
    color:var(--panel-2); font-size:14.5px; font-weight:700; line-height:1.3; min-height:56px;
    display:flex; align-items:center; justify-content:center; transition:transform .12s ease;
  }
  .choice-btn:active{ transform:scale(0.97); }
  .choice-btn.correct{ background:var(--ok); border-color:var(--ok); color:#08281a; }
  .choice-btn.wrong{ background:var(--danger); border-color:var(--danger); color:#2c0a08; }
  .choice-btn.dim{ opacity:.45; }
  .choice-btn[disabled]{ pointer-events:none; }

  .stamp{
    position:fixed; top:38%; left:50%; z-index:60; pointer-events:none;
    font-family:var(--font-display); font-weight:900; font-size:40px; letter-spacing:2px;
    border:6px solid currentColor; border-radius:10px; padding:6px 18px;
    transform:translate(-50%,-50%) rotate(-10deg) scale(0.4); opacity:0;
  }
  .stamp.show{ animation: stampHit .5s cubic-bezier(.2,.8,.3,1.4) forwards; }
  @keyframes stampHit{
    0%{ opacity:0; transform:translate(-50%,-50%) rotate(-10deg) scale(2.4); }
    55%{ opacity:1; transform:translate(-50%,-50%) rotate(-10deg) scale(0.92); }
    75%{ transform:translate(-50%,-50%) rotate(-10deg) scale(1.06); }
    100%{ opacity:0; transform:translate(-50%,-50%) rotate(-10deg) scale(1.05); }
  }
  .stamp.ok{ color:var(--ok); }
  .stamp.ng{ color:var(--danger); }

  .coin-float{
    position:fixed; z-index:61; font-weight:900; font-size:15px; color:var(--yellow); pointer-events:none;
    animation: coinUp 0.9s ease forwards;
  }
  @keyframes coinUp{ 0%{ opacity:0; transform:translateY(0);} 20%{opacity:1;} 100%{ opacity:0; transform:translateY(-46px);} }

  /* ================= RESULT ================= */
  .result-card{ background:var(--panel); border-radius:16px; padding:26px 20px; text-align:center; border:3px solid var(--yellow-dark); }
  .result-title{ font-size:20px; font-weight:900; color:var(--ink); letter-spacing:1px; }
  .result-sub{ font-size:12px; color:var(--ink-dim); margin-top:4px; }
  .result-grid{ display:flex; gap:10px; margin:18px 0; }
  .result-stat{ flex:1; background:var(--panel-2); border-radius:10px; padding:12px 6px; border:2px solid #d9cdb0; }
  .result-stat .v{ font-size:20px; font-weight:900; color:var(--ink); }
  .result-stat .l{ font-size:10.5px; color:var(--ink-dim); margin-top:2px; }
  .btn-row{ display:flex; gap:10px; margin-top:6px; }
  .btn-primary, .btn-ghost{ flex:1; padding:13px; border-radius:10px; font-weight:800; font-size:14px; border:none; }
  .btn-primary{ background:linear-gradient(180deg,var(--yellow),var(--yellow-dark)); color:#241800; box-shadow:0 5px 0 #8a6300; }
  .btn-primary:active{ transform:translateY(3px); box-shadow:0 2px 0 #8a6300; }
  .btn-ghost{ background:var(--steel-mid); color:var(--panel-2); border:2px solid var(--steel-light); }


  /* ================= NOTEBOOK ================= */
  .nb-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .back-btn{ background:var(--steel-mid); border:2px solid var(--steel-light); color:var(--panel-2); border-radius:8px; padding:8px 12px; font-weight:700; font-size:13px; }
  .nb-progress{ background:var(--steel-mid); border:2px solid var(--steel-light); border-radius:10px; padding:12px; margin-bottom:12px; }
  .nb-progress-bar{ height:10px; border-radius:5px; background:var(--steel-dark); overflow:hidden; margin-top:8px; }
  .nb-progress-fill{ height:100%; background:linear-gradient(90deg,var(--ok),#7fe0ac); border-radius:5px; transition:width .4s ease; }
  .nb-legend{ display:flex; gap:12px; font-size:10.5px; color:var(--ink-faint); margin-top:8px; flex-wrap:wrap; }
  .nb-legend span{ display:inline-flex; align-items:center; gap:4px; }
  .nb-legend i{ width:9px; height:9px; border-radius:3px; display:inline-block; }

  .nb-grid{ display:grid; grid-template-columns:repeat(8,1fr); gap:6px; }
  .nb-tile{
    aspect-ratio:1; border-radius:6px; background:var(--steel-light); border:1px solid rgba(255,255,255,0.08);
    display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:800; color:var(--panel-2);
  }
  .nb-tile.learning{ background:var(--yellow-dark); color:#241800; }
  .nb-tile.mastered{ background:var(--ok); color:#08281a; }

  .modal-back{ position:fixed; inset:0; background:rgba(10,14,18,0.72); z-index:80; display:flex; align-items:center; justify-content:center; padding:20px; }
  .modal-card{ background:var(--panel); border-radius:16px; padding:22px; width:100%; max-width:340px; text-align:center; border:3px solid var(--steel-light); }
  .modal-en{ font-size:22px; font-weight:900; color:var(--ink); font-family:Georgia,serif; }
  .modal-ja{ font-size:16px; color:var(--ink-dim); margin-top:6px; }
  .modal-stats{ display:flex; gap:8px; margin-top:14px; }
  .modal-stats .m{ flex:1; background:var(--panel-2); border-radius:8px; padding:8px 4px; font-size:11px; color:var(--ink-dim); }
  .modal-stats .m b{ display:block; font-size:15px; color:var(--ink); }
  .modal-close{ margin-top:16px; width:100%; padding:11px; border-radius:9px; border:none; background:var(--steel-mid); color:var(--panel-2); font-weight:700; }

  /* ================= CHALLENGE MODE ================= */
  .lb-panel{ background:var(--steel-mid); border:2px solid var(--steel-light); border-radius:12px; padding:14px; margin-top:16px; text-align:left; }
  .lb-panel .lb-section-title{ color:var(--ink-faint); margin:0 0 8px; }
  .lb-section-title{ font-size:11.5px; font-weight:800; color:var(--ink-dim); letter-spacing:1.5px; margin:18px 0 8px; text-align:left; }
  .lb-row{ display:flex; align-items:center; gap:10px; background:var(--panel-2); border:2px solid #d9cdb0; border-radius:10px; padding:9px 12px; margin-bottom:7px; }
  .lb-medal{ font-size:18px; width:24px; text-align:center; }
  .lb-info{ flex:1; text-align:left; }
  .lb-info .sc{ font-weight:900; color:var(--ink); font-size:14px; }
  .lb-info .cb{ font-size:10.5px; color:var(--ink-dim); }
  .lb-empty{ font-size:12px; color:var(--ink-faint); padding:10px 0; }

  .timer-track{ height:9px; border-radius:5px; background:var(--steel-dark); overflow:hidden; margin-bottom:14px; border:2px solid var(--steel-light); }
  .timer-fill{ height:100%; width:100%; background:linear-gradient(90deg,var(--ok),var(--yellow)); border-radius:5px; }
  .timer-fill.danger{ background:linear-gradient(90deg,var(--rust),var(--danger)); }

  .countdown-overlay{ position:fixed; inset:0; background:rgba(10,14,18,0.86); z-index:90; display:flex; align-items:center; justify-content:center; }
  .countdown-overlay.hidden{ display:none; }
  .countdown-num{ font-size:64px; font-weight:900; color:var(--yellow); transform:scale(0.4); opacity:0; }
  .countdown-num.pop{ animation: cdPop .75s cubic-bezier(.2,.8,.3,1.3) forwards; }
  @keyframes cdPop{ 0%{ opacity:0; transform:scale(0.4);} 40%{ opacity:1; transform:scale(1.15);} 100%{ opacity:1; transform:scale(1);} }
  .countdown-num.go{ color:var(--ok); font-size:42px; }

  .newrecord-banner{ margin-top:14px; padding:10px; border-radius:10px; background:var(--yellow); color:#241800; font-weight:900; font-size:13.5px; }
  .newrecord-banner.hidden{ display:none; }

  /* ================= FACTORY PRODUCTION LINE (car press + conveyor) ================= */
  .factory-line{
    position:relative; margin-top:14px; height:78px; border-radius:12px; overflow:hidden;
    background:linear-gradient(180deg,#212932,#161b21); border:2px solid var(--steel-light);
  }
  .press-unit{
    position:absolute; left:0; top:0; bottom:0; width:48px; z-index:3;
    background:var(--steel-mid); border-right:2px solid var(--steel-light);
    display:flex; flex-direction:column; align-items:center; justify-content:flex-end; padding-bottom:26px;
  }
  .press-arm{
    width:26px; height:20px; border-radius:3px;
    background:linear-gradient(180deg,#d3d9de,#8b939c); border:2px solid #565f68;
  }
  .press-arm.slam{ animation: pressSlam .32s cubic-bezier(.6,0,.4,1); }
  @keyframes pressSlam{ 0%{ transform:translateY(0); } 45%{ transform:translateY(16px); } 100%{ transform:translateY(0); } }
  .press-jaw{ width:34px; height:7px; margin-top:3px; border-radius:2px; background:var(--yellow-dark); }
  .belt-lane{
    position:absolute; left:48px; right:0; bottom:0; height:34px; overflow:hidden;
    background: repeating-linear-gradient(90deg, #333f4a 0 18px, #29323b 18px 36px);
    border-top:3px solid #10141a;
  }
  .belt-lane::before{
    content:""; position:absolute; inset:0;
    background: repeating-linear-gradient(90deg, rgba(255,255,255,0.06) 0 3px, transparent 3px 18px);
    animation: beltMove 0.9s linear infinite;
  }
  @keyframes beltMove{ from{ background-position-x:0; } to{ background-position-x:-36px; } }

  .factory-car{ position:absolute; bottom:5px; left:-52px; width:44px; height:24px; transition:left 2.6s linear; z-index:2; }
  .factory-car.roll{ left:calc(100% + 30px); }
  .factory-car .fc-body{ position:absolute; bottom:5px; left:0; width:44px; height:10px; border-radius:5px 5px 2px 2px; box-shadow: inset 0 -2px 0 rgba(0,0,0,0.15); }
  .factory-car .fc-cabin{ position:absolute; bottom:14px; left:11px; width:22px; height:9px; border-radius:5px 5px 0 0; }
  .factory-car .fc-win{ position:absolute; bottom:15px; left:14px; width:16px; height:6px; border-radius:3px 3px 0 0; background:#bfe3ff; opacity:.88; }
  .factory-car .fc-wheel{ position:absolute; bottom:0; width:9px; height:9px; border-radius:50%; background:#191c20; border:2px solid #4a4f55; }
  .factory-car .fc-wheel.w1{ left:5px; } .factory-car .fc-wheel.w2{ left:29px; }

  .factory-car.type-hatch .fc-body{ width:38px; }
  .factory-car.type-hatch .fc-cabin{ left:13px; width:20px; bottom:14px; }
  .factory-car.type-hatch .fc-win{ left:16px; width:14px; }
  .factory-car.type-hatch .fc-wheel.w2{ left:24px; }

  .factory-car.type-van .fc-cabin{ left:4px; width:34px; bottom:14px; height:11px; border-radius:4px 4px 0 0; }
  .factory-car.type-van .fc-win{ left:7px; width:28px; bottom:16px; }

  .factory-car.type-sports .fc-body{ height:8px; bottom:6px; }
  .factory-car.type-sports .fc-cabin{ left:17px; width:16px; bottom:13px; height:7px; border-radius:8px 10px 0 0; }
  .factory-car.type-sports .fc-win{ left:19px; width:11px; bottom:14px; height:5px; }

  .factory-car.color-red .fc-body, .factory-car.color-red .fc-cabin{ background:#d64545; }
  .factory-car.color-blue .fc-body, .factory-car.color-blue .fc-cabin{ background:#3f6fd6; }
  .factory-car.color-yellow .fc-body, .factory-car.color-yellow .fc-cabin{ background:#f2c230; }
  .factory-car.color-white .fc-body, .factory-car.color-white .fc-cabin{ background:#eef1f3; border:1px solid #c7ccd1; }
  .factory-car.color-gray .fc-body, .factory-car.color-gray .fc-cabin{ background:#8b939c; }

  @media (max-width:360px){ .nb-grid{ grid-template-columns:repeat(6,1fr); } .prompt{ font-size:23px; } }
</style>
</head>
<body>
<div class="stage">

  <!-- ============ TITLE ============ -->
  <section class="screen active" id="screen-title">
    <div class="plant">
      <div class="sky-glow"></div>
      <span class="gear-deco" style="top:10px;left:14px;">⚙️</span>
      <span class="gear-deco g2" style="top:30px;right:20px;">⚙️</span>
      <div class="stack s1"><div class="smoke" style="left:0;animation-delay:0s;"></div><div class="smoke" style="left:0;animation-delay:1.5s;"></div></div>
      <div class="stack s2"><div class="smoke" style="left:0;animation-delay:.7s;"></div><div class="smoke" style="left:0;animation-delay:2.2s;"></div></div>
      <div class="stack s3"><div class="smoke" style="left:0;animation-delay:1.1s;"></div></div>
      <div class="plant-building">
        <div class="window" style="left:22px;"></div>
        <div class="window" style="left:60px;"></div>
        <div class="window" style="right:70px;"></div>
        <div class="window" style="right:30px;"></div>
      </div>
    </div>
    <div class="title-wrap">
      <div class="title-eyebrow">WORD FACTORY — 100 WORDS</div>
      <h1 class="title-main">英単語工場</h1>
      <div class="title-sub">制限時間内に答えてポイントを稼ごう。10問全問正解でボーナス問題、連続正解が続く限り最大30問まで挑戦できる！</div>
      <button class="start-btn" id="btnStart">操業開始 ▶<span class="rivets"></span></button>
      <div class="title-stats">
        <div class="stat-card"><div class="v" id="statBest">0</div><div class="l">自己ベスト</div></div>
        <div class="stat-card"><div class="v" id="statMastered">0/100</div><div class="l">習得ワード</div></div>
      </div>
      <div class="lb-panel">
        <div class="lb-section-title">歴代トップ3</div>
        <div id="lbList"></div>
      </div>
      <button class="notebook-link" id="btnNotebook">📒 単語ノートをひらく</button>

<script>
/* ============ WORD BANK (from the 100-question worksheet) ============ */
const RAW_WORDS = [
["same","同じ"],["experience","経験、体験"],["actually","実は"],["by the way","ところで"],
["holiday","休日"],["arrive","到着する"],["soon","すぐに"],["will","〜でしょう"],
["excited","わくわくした"],["See you.","またね"],["tall","高さがある"],["find","見つける"],
["found","find の過去形"],["language","言語"],["for example","例えば（2語）"],["area","エリア"],
["culture","文化"],["and so on","〜など"],["speech","スピーチ"],["if","もしも"],
["would love to","〜したい（3語）"],["be interested in","〜に興味がある（3語）"],["kind(s) of","種類の（2語）"],["forget","忘れる"],
["because","〜だから"],["thick","厚い、とろっとした"],["early","早い"],["foreign","外国の"],
["change","変化する"],["come from","〜出身である（2語）"],["Here is","これが〜です（2語）"],["name ~ after …","〜にちなんで〜と名付ける"],
["may","〜しても良い"],["ask ~ a favor","〜にお願いする（2語）"],["could","can の過去形"],["Say cheese!","はい、チーズ！"],
["golden","金色の"],["flight","飛行"],["See you.","またね（2語）"],["airport","空港"],
["seafood","シーフード"],["reservation","予約"],["meter","メートル"],["weigh","重さがある"],
["ton","トン"],["dollar","ドル"],["communicate","意思疎通をする"],["painting","絵"],
["wall","壁"],["surprised","驚いた"],["especially","特に"],["order","〜を注文する"],
["topping","トッピング"],["various","いろいろな"],["flavor","味"],["soy sauce","しょうゆ"],
["salt","塩"],["sometime","いつか"],["add","〜を加える"],["butter","バター"],
["recommended","おすすめの"],["manufacture","製造業者"],["reflect","〜を反映する"],["climate","気候"],
["life","生活"],["lives","life の複数形"],["creativity","創造性"],["chef","シェフ"],
["variation","変化"],["create","〜を創造する"],["sauce","ソース"],["traveler","旅行者"],
["resident","居住者"],["menu","メニュー"],["Singapore","シンガポール"],["went","go の過去形"],
["was","is, am の過去形"],["were","are の過去形"],["had","have の過去形"],["saw","see の過去形"],
["bought","buy の過去形"],["did","do の過去形"],["came","come の過去形"],["made","make の過去形"],
["took","take の過去形"],["there is (are)","〜がある"],["world","世界"],["interesting","面白い"],
["enjoy","楽しむ"],["language","言語"],["different","異なった"],["English","英語"],
["leave","出発する"],["family","家族"],["brother","兄弟"],["open","〜を開く"],
["breakfast","朝食"],["people","人々"],["know","知っている"],["egg","卵"]
];
const WORD_BANK = RAW_WORDS.map(([en,ja],i)=>({ id:i, en, ja }));
/* strip helper annotations like "（2語）" / "(2語)" so they never show up in the quiz itself */
WORD_BANK.forEach(w=> w.ja = w.ja.replace(/[（(][^）)]*[）)]/g, '').trim());
/* difficulty rating (1=easy, 2=medium, 3=hard) used for challenge-mode scoring */
function computeDifficulty(en, ja){
  if(ja.includes('の過去形') || ja.includes('の複数形')) return 2;
  if(en.includes(' ') || en.includes('~') || en.includes('…')) return 3;
  if(en.replace(/[.!]/g,'').length <= 5) return 1;
  return 2;
}
WORD_BANK.forEach(w=> w.diff = computeDifficulty(w.en, w.ja));
const DIFF_LABEL = {1:'★☆☆', 2:'★★☆', 3:'★★★'};

/* ============ STATE ============ */
let wordStats = {}; // id -> {seen, correct, wrong, streak}  (drives the 単語ノート)

/* ============ STORAGE (works as a saved artifact or a standalone downloaded file) ============ */
async function storageGet(key){
  try{
    if(window.storage && typeof window.storage.get === 'function'){
      const r = await window.storage.get(key, false);
      return r ? r.value : null;
    }
  }catch(e){}
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
async function storageSet(key, value){
  try{
    if(window.storage && typeof window.storage.set === 'function'){
      await window.storage.set(key, value, false);
      return;
    }
  }catch(e){}
  try{ localStorage.setItem(key, value); }catch(e){}
}
async function loadState(){
  try{
    const raw = await storageGet('wordfactory-stats-v1');
    if(raw) wordStats = JSON.parse(raw);
  }catch(e){}
  refreshTitle();
}
async function saveStats(){ await storageSet('wordfactory-stats-v1', JSON.stringify(wordStats)); }
function getStat(id){ if(!wordStats[id]) wordStats[id] = {seen:0, correct:0, wrong:0, streak:0}; return wordStats[id]; }

/* ============ SOUND (simple WebAudio synth, no external assets) ============ */
let actx = null;
function audioCtx(){
  if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(actx && actx.state === 'suspended'){ try{ actx.resume(); }catch(e){} }
  return actx;
}
function tone(freq,start,dur,type,gain){
  const ctx = audioCtx(); if(!ctx) return;
  const t0 = ctx.currentTime+start;
  const osc = ctx.createOscillator(); const g = ctx.createGain();
  osc.type=type; osc.frequency.setValueAtTime(freq,t0);
  g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(gain,t0+0.015);
  g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(t0); osc.stop(t0+dur+0.02);
}
function sfxCorrect(){ tone(783.99,0,0.12,"sine",0.28); tone(1046.5,0.06,0.2,"sine",0.3); }
function sfxWrong(){ tone(220,0,0.14,"square",0.24); tone(146.8,0.08,0.22,"sawtooth",0.18); }
function sfxCoin(){ tone(1318.5,0,0.08,"square",0.18); tone(1568,0.05,0.1,"square",0.16); }
function sfxRankUp(){ [523.25,659.25,783.99,1046.5].forEach((f,i)=> tone(f,i*0.09,0.22,"triangle",0.16)); }

function speakWord(text, lang){
  try{
    if(!('speechSynthesis' in window)) return;
    const spoken = String(text).replace(/過去形/g, 'かこけい').replace(/複数形/g, 'ふくすうけい');
    const u = new SpeechSynthesisUtterance(spoken);
    u.lang = lang || 'en-US'; u.rate = 0.92;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}

/* ============ NAV ============ */
const screens = {
  title: document.getElementById('screen-title'),
  notebook: document.getElementById('screen-notebook'),
  challenge: document.getElementById('screen-challenge'),
  challengeResult: document.getElementById('screen-challenge-result'),
};
function showScreen(name){ Object.values(screens).forEach(s=>s.classList.remove('active')); screens[name].classList.add('active'); }

/* ============ TITLE STATS ============ */
function masteredCount(){
  let n=0; WORD_BANK.forEach(w=>{ const s=wordStats[w.id]; if(s && s.streak>=3) n++; });
  return n;
}
async function refreshTitle(){
  const scores = await loadChallengeScores();
  renderLeaderboard(scores, 'lbList');
  document.getElementById('statBest').textContent = scores.length ? scores[0].score.toLocaleString('ja-JP') : '0';
  document.getElementById('statMastered').textContent = masteredCount()+'/100';
}

function buildChoices(correctWord, dir){
  const correctVal = dir==='en2ja' ? correctWord.ja : correctWord.en;
  const others = WORD_BANK.filter(w=> w.id!==correctWord.id);
  const shuffled = others.sort(()=>Math.random()-0.5);
  const distractors = [];
  for(const w of shuffled){
    const val = dir==='en2ja' ? w.ja : w.en;
    if(val===correctVal) continue;
    if(distractors.some(d=>d.val===val)) continue;
    distractors.push({ val });
    if(distractors.length===3) break;
  }
  const all = [{val:correctVal, correct:true}, ...distractors.map(d=>({val:d.val, correct:false}))];
  return all.sort(()=>Math.random()-0.5);
}

function showStamp(kind){
  const s = document.createElement('div');
  s.className = 'stamp '+(kind==='ok'?'ok':'ng');
  s.textContent = kind==='ok' ? 'OK' : 'NG';
  document.body.appendChild(s);
  requestAnimationFrame(()=> s.classList.add('show'));
  setTimeout(()=> s.remove(), 650);
}
function floatCoin(amount, label){
  const el = document.createElement('div');
  el.className = 'coin-float'; el.textContent = (label||'+') + amount.toLocaleString('ja-JP');
  el.style.left = (innerWidth/2 - 20)+'px'; el.style.top = '40%';
  document.body.appendChild(el);
  setTimeout(()=> el.remove(), 900);
}

/* ============ PRODUCTION LINE (a car is pressed + rolls off on every correct answer) ============ */
const CAR_TYPES = ['sedan','hatch','van','sports'];
const CAR_COLORS = ['red','blue','yellow','white','gray'];
function triggerPress(){
  const arm = document.getElementById('pressArm');
  if(!arm) return;
  arm.classList.remove('slam'); void arm.offsetWidth; arm.classList.add('slam');
}
function spawnFactoryCar(){
  const lane = document.getElementById('beltLane');
  if(!lane) return;
  const type = CAR_TYPES[Math.floor(Math.random()*CAR_TYPES.length)];
  const color = CAR_COLORS[Math.floor(Math.random()*CAR_COLORS.length)];
  const car = document.createElement('div');
  car.className = `factory-car type-${type} color-${color}`;
  car.innerHTML = '<div class="fc-cabin"></div><div class="fc-win"></div><div class="fc-body"></div><div class="fc-wheel w1"></div><div class="fc-wheel w2"></div>';
  lane.appendChild(car);
  requestAnimationFrame(()=> requestAnimationFrame(()=> car.classList.add('roll')));
  setTimeout(()=> car.remove(), 2900);
}

/* ============ CHALLENGE MODE (チャレンジ) ============ */
const CH_SIZE = 10;         // base round length
const CH_MAX_SIZE = 30;     // absolute cap when extending on a perfect streak
const CH_TIME_MS = 4000;
const CH_FAST_MS = 1200;
let chal = { words:[], dirs:[], usedIds:new Set(), index:0, score:0, combo:0, maxCombo:0, correct:0, qStart:0, timerRAF:null };

async function loadChallengeScores(){
  try{ const raw = await storageGet('wordfactory-challenge-scores-v1'); return raw ? JSON.parse(raw) : []; }
  catch(e){ return []; }
}
async function saveChallengeScores(scores){ await storageSet('wordfactory-challenge-scores-v1', JSON.stringify(scores)); }

function renderLeaderboard(list, elId){
  const el = document.getElementById(elId);
  if(!list.length){ el.innerHTML = '<div class="lb-empty">まだ記録がないよ。最初の記録を作ろう！</div>'; return; }
  const medals = ['🥇','🥈','🥉'];
  el.innerHTML = list.map((s,i)=>
    `<div class="lb-row"><div class="lb-medal">${medals[i]||'🏅'}</div>
     <div class="lb-info"><div class="sc">${s.score.toLocaleString('ja-JP')} pt</div><div class="cb">最大コンボ ${s.combo}</div></div></div>`
  ).join('');
}

function pickChallengeWords(){
  // prioritize unseen / weaker words so the challenge doubles as practice, with some randomness mixed in
  const scored = WORD_BANK.map(w=>{
    const s = wordStats[w.id];
    let weight = 3;
    if(s){ weight = s.streak>=3 ? 1 : (2 + s.wrong); }
    return { w, weight: weight + Math.random()*2 };
  });
  scored.sort((a,b)=> b.weight - a.weight);
  const pool = scored.slice(0, Math.min(40, scored.length)).map(x=>x.w);
  const chosen = [];
  while(chosen.length < CH_SIZE && pool.length){
    const i = Math.floor(Math.random()*pool.length);
    chosen.push(pool.splice(i,1)[0]);
  }
  return chosen;
}
function pickBonusWord(usedIds){
  const pool = WORD_BANK.filter(w=> !usedIds.has(w.id));
  if(!pool.length) return null;
  return pool[Math.floor(Math.random()*pool.length)];
}

function chSpeedWeight(elapsedMs){
  if(elapsedMs <= CH_FAST_MS) return 1.45;
  if(elapsedMs >= CH_TIME_MS) return 1.0;
  const t = (elapsedMs - CH_FAST_MS) / (CH_TIME_MS - CH_FAST_MS);
  return 1.45 - t*0.45;
}
/* combo bonus compounds with each consecutive correct answer -> accelerating growth */
function chComboWeight(combo){ return Math.pow(1.15, Math.max(combo-1,0)); }
const CH_DIFF_WEIGHT = {1:1, 2:1.15, 3:1.35};
const CH_BASE = 100;
const CH_MAX_SCORE = 1000000;
/* raw point total for the best possible run: hardest words, fastest answers, a perfect streak
   all the way to the 30-question cap. The scale factor is calibrated so that this ideal run
   lands exactly on the 1,000,000 ceiling — there is no minimum/floor score. */
function chBestRawSum(){
  let sum = 0;
  for(let c=1; c<=CH_MAX_SIZE; c++) sum += CH_BASE * CH_DIFF_WEIGHT[3] * 1.45 * chComboWeight(c);
  return sum;
}
const CH_SCALE = CH_MAX_SCORE / chBestRawSum();

function startChallengeCountdown(){
  audioCtx();
  const overlay = document.getElementById('cdOverlay');
  const numEl = document.getElementById('cdNum');
  overlay.classList.remove('hidden');
  let count = 3;
  function step(){
    numEl.textContent = count>0 ? String(count) : 'スタート！';
    numEl.classList.remove('pop','go'); void numEl.offsetWidth; numEl.classList.add('pop');
    if(count<=0) numEl.classList.add('go');
    tone(880,0,0.05,'square',0.05);
    if(count>0){ count--; setTimeout(step, 700); }
    else{ setTimeout(()=>{ overlay.classList.add('hidden'); startChallenge(); }, 600); }
  }
  step();
}

function startChallenge(){
  const words = pickChallengeWords();
  chal = { words, dirs:[], usedIds:new Set(words.map(w=>w.id)), index:0, score:0, combo:0, maxCombo:0, correct:0, qStart:0, timerRAF:null };
  chal.dirs = chal.words.map(()=> Math.random()<0.6 ? 'en2ja' : 'ja2en');
  showScreen('challenge');
  renderChallengeQuestion();
}

function updateChallengeHud(){
  const denom = chal.words.length > CH_SIZE ? CH_MAX_SIZE : CH_SIZE;
  document.getElementById('chQNum').textContent = (chal.index+1)+'/'+denom;
  const scoreEl = document.getElementById('chScore');
  scoreEl.textContent = chal.score >= CH_MAX_SCORE ? chal.score.toLocaleString('ja-JP')+' MAX!' : chal.score.toLocaleString('ja-JP');
  document.getElementById('chCombo').textContent = chal.combo;
}

function startChallengeTimerBar(){
  const fill = document.getElementById('chTimerFill');
  fill.classList.remove('danger');
  fill.style.transition = 'none'; fill.style.width = '100%';
  chal.qStart = performance.now();
  if(chal.timerRAF) cancelAnimationFrame(chal.timerRAF);
  function step(){
    const elapsed = performance.now() - chal.qStart;
    const pct = Math.max(0, 100 - (elapsed/CH_TIME_MS)*100);
    fill.style.width = pct + '%';
    if(pct < 30) fill.classList.add('danger');
    if(pct > 0) chal.timerRAF = requestAnimationFrame(step);
    else onChallengeAnswer(null, true); // time's up -> treat as miss
  }
  requestAnimationFrame(()=>{ fill.style.transition = 'width .05s linear'; chal.timerRAF = requestAnimationFrame(step); });
}

function renderChallengeQuestion(){
  updateChallengeHud();
  const w = chal.words[chal.index];
  const dir = chal.dirs[chal.index];
  const tag = document.getElementById('chTag');
  const prompt = document.getElementById('chPrompt');
  const diffLabel = DIFF_LABEL[w.diff] || '★☆☆';
  if(dir==='en2ja'){ tag.textContent = diffLabel+'　この英語を日本語にすると？'; prompt.textContent = w.en; prompt.classList.add('en'); }
  else{ tag.textContent = diffLabel+'　この日本語を英語にすると？'; prompt.textContent = w.ja; prompt.classList.remove('en'); }
  document.getElementById('btnChSpeak').onclick = ()=> speakWord(dir==='en2ja'?w.en:w.ja, dir==='en2ja'?'en-US':'ja-JP');
  speakWord(dir==='en2ja'?w.en:w.ja, dir==='en2ja'?'en-US':'ja-JP');

  const choices = buildChoices(w, dir);
  const wrap = document.getElementById('chChoices'); wrap.innerHTML='';
  choices.forEach(ch=>{
    const b = document.createElement('button');
    b.className='choice-btn'; b.textContent = ch.val;
    b.onclick = ()=> onChallengeAnswer(b, ch.correct);
    wrap.appendChild(b);
  });
  startChallengeTimerBar();
}

let chLocked = false;
function onChallengeAnswer(btn, isCorrect){
  if(chLocked) return; chLocked = true;
  if(chal.timerRAF) cancelAnimationFrame(chal.timerRAF);
  document.querySelectorAll('#chChoices .choice-btn').forEach(b=> b.disabled = true);
  const w = chal.words[chal.index];
  const dir = chal.dirs[chal.index];
  const correctVal = dir==='en2ja' ? w.ja : w.en;
  const elapsed = performance.now() - chal.qStart;

  // every answer in the challenge also feeds the 単語ノート, so playing IS studying
  const stat = getStat(w.id);
  stat.seen++;

  if(isCorrect && btn){
    btn.classList.add('correct');
    stat.correct++; stat.streak = Math.min(stat.streak+1, 5);
    chal.combo++; chal.maxCombo = Math.max(chal.maxCombo, chal.combo); chal.correct++;
    const raw = CH_BASE * CH_DIFF_WEIGHT[w.diff] * chSpeedWeight(elapsed) * chComboWeight(chal.combo);
    const gained = Math.round(raw * CH_SCALE);
    chal.score = Math.min(chal.score + gained, CH_MAX_SCORE);
    showStamp('ok'); sfxCorrect(); setTimeout(sfxCoin, 90);
    triggerPress(); setTimeout(spawnFactoryCar, 140);
    floatCoin(gained, '+');
  } else {
    if(btn) btn.classList.add('wrong');
    document.querySelectorAll('#chChoices .choice-btn').forEach(b=>{
      if(b.textContent === correctVal) b.classList.add('correct');
      else if(b!==btn) b.classList.add('dim');
    });
    stat.wrong++; stat.streak = 0;
    chal.combo = 0;
    showStamp('ng'); sfxWrong();
  }
  saveStats();
  updateChallengeHud();

  setTimeout(()=>{
    chLocked = false;
    chal.index++;
    if(chal.index < chal.words.length){
      renderChallengeQuestion();
    } else if(chal.correct === chal.words.length && chal.words.length < CH_MAX_SIZE){
      // perfect streak so far -> add one more bonus question
      const extra = pickBonusWord(chal.usedIds);
      if(extra){
        chal.usedIds.add(extra.id);
        chal.words.push(extra);
        chal.dirs.push(Math.random()<0.6 ? 'en2ja' : 'ja2en');
        renderChallengeQuestion();
      } else {
        finishChallenge();
      }
    } else {
      finishChallenge();
    }
  }, isCorrect ? 650 : 1000);
}

async function finishChallenge(){
  chal.score = Math.min(chal.score, CH_MAX_SCORE);

  const scores = await loadChallengeScores();
  const worstOfTop3 = scores.length>=3 ? Math.min(...scores.slice(0,3).map(s=>s.score)) : -1;
  const madeTop3 = scores.length<3 || chal.score > worstOfTop3;
  scores.push({ score: chal.score, combo: chal.maxCombo });
  scores.sort((a,b)=> b.score-a.score);
  const top3 = scores.slice(0,3);
  await saveChallengeScores(top3);

  document.getElementById('chResultTitle').textContent = madeTop3 ? '🏆 新記録！' : 'チャレンジ終了！';
  document.getElementById('chResultSub').textContent = `${chal.correct}/${chal.words.length}問 せいかい`;
  document.getElementById('chFinalScore').textContent = chal.score.toLocaleString('ja-JP');
  document.getElementById('chFinalCorrect').textContent = chal.correct+'/'+chal.words.length;
  document.getElementById('chFinalCombo').textContent = chal.maxCombo;
  document.getElementById('chNewRecordBanner').classList.toggle('hidden', !madeTop3);
  if(madeTop3) sfxRankUp();
  renderLeaderboard(top3, 'chLbList');
  showScreen('challengeResult');
}

/* ============ NOTEBOOK ============ */
function statusOf(id){
  const s = wordStats[id];
  if(!s || s.seen===0) return 'new';
  if(s.streak>=3) return 'mastered';
  return 'learning';
}
function renderNotebook(){
  const grid = document.getElementById('nbGrid'); grid.innerHTML='';
  WORD_BANK.forEach(w=>{
    const st = statusOf(w.id);
    const tile = document.createElement('div');
    tile.className = 'nb-tile ' + (st==='mastered'?'mastered': st==='learning'?'learning':'');
    tile.textContent = w.id+1;
    tile.onclick = ()=> openWordModal(w);
    grid.appendChild(tile);
  });
  const pct = Math.round(masteredCount()/WORD_BANK.length*100);
  document.getElementById('nbPercent').textContent = pct+'%';
  document.getElementById('nbFill').style.width = pct+'%';
}
function openWordModal(w){
  const s = wordStats[w.id] || {seen:0,correct:0,wrong:0,streak:0};
  const layer = document.getElementById('modalLayer');
  layer.innerHTML = `
    <div class="modal-back" id="modalBack">
      <div class="modal-card">
        <div class="modal-en">${w.en}</div>
        <div class="modal-ja">${w.ja}</div>
        <div class="modal-stats">
          <div class="m"><b>${s.seen}</b>挑戦</div>
          <div class="m"><b>${s.correct}</b>正解</div>
          <div class="m"><b>${s.streak}</b>連続正解</div>
        </div>
        <button class="modal-close" id="modalSpeak">🔊 発音を聞く</button>
        <button class="modal-close" id="modalClose" style="margin-top:8px;">とじる</button>
      </div>
    </div>`;
  document.getElementById('modalBack').onclick = (e)=>{ if(e.target.id==='modalBack') layer.innerHTML=''; };
  document.getElementById('modalSpeak').onclick = ()=> speakWord(w.en);
  document.getElementById('modalClose').onclick = ()=> layer.innerHTML='';
}

/* ============ EVENTS ============ */
document.getElementById('btnStart').onclick = ()=>{ audioCtx(); startChallengeCountdown(); };
document.getElementById('btnNotebook').onclick = ()=>{ renderNotebook(); showScreen('notebook'); };
document.getElementById('btnNbBack').onclick = ()=>{ refreshTitle(); showScreen('title'); };
document.getElementById('btnChToTitle').onclick = ()=>{ refreshTitle(); showScreen('title'); };
document.getElementById('btnChRetry').onclick = ()=> startChallengeCountdown();
document.getElementById('btnReset').onclick = ()=>{
  if(confirm('これまでの記録（スコア・単語の習得状況）をすべて消去します。よろしいですか？')){
    wordStats = {};
    saveStats(); saveChallengeScores([]); refreshTitle();
  }
};

loadState();
</script>
