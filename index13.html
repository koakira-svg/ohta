<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>単語工場 -WORD FACTORY-</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Noto+Sans+JP:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@twemoji/api@latest/dist/twemoji.min.js" crossorigin="anonymous"></script>

<style>
:root{
  --steel-900:#14161b; --steel-800:#1d2027; --steel-700:#2a2e37; --steel-600:#3a3f4a;
  --yellow:#ffc72c; --orange:#ff6a3d; --green:#3ddc84; --red:#ff4757; --paper:#f4ecd8;
}
*{box-sizing:border-box; user-select:none; touch-action: manipulation;}
html,body{margin:0;padding:0;height:100dvh;background:var(--steel-900);font-family:'Noto Sans JP', sans-serif;color:var(--paper);overflow:hidden;}
#app{width:100%;height:100dvh;display:flex;flex-direction:column;align-items:center;padding:8px;}

/* 単語ノート専用スタイル */
.word-note-panel{width:100%; max-width:800px; height:96dvh; display:flex; flex-direction:column; background:var(--steel-800); border-radius:12px; padding:12px; border:2px solid var(--steel-600);}
.progress-container{width:100%; background:var(--steel-900); height:24px; border-radius:12px; margin:8px 0; position:relative; overflow:hidden; border:1px solid var(--steel-600);}
.progress-bar{height:100%; background:var(--green); width:0%; transition:width 0.5s ease;}
.progress-text{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700;}

.word-grid{display:grid; grid-template-columns:repeat(5, 1fr); gap:6px; overflow-y:auto; padding:4px;}
.word-tile{
  padding:6px; border-radius:6px; border:1px solid rgba(0,0,0,0.2); 
  display:flex; flex-direction:column; justify-content:center; align-items:center;
  text-align:center; min-height:60px; color:#1c1c1c; font-weight:700;
}
.word-tile-en{font-family:'Archivo Black', sans-serif; font-size:11px;}
.word-tile-jp{font-size:9px;}
.word-tile-score{font-size:8px; margin-top:2px; font-family:monospace;}

.btn{padding:8px 16px; background:var(--yellow); border:none; border-radius:6px; font-weight:900; cursor:pointer; width:100%;}
</style>
</head>
<body>

<div id="app">
  <div class="word-note-panel">
    <div style="text-align:center; font-weight:900; margin-bottom:4px;">📒 単語習熟度図鑑</div>
    
    <!-- 達成度表示 -->
    <div class="progress-container">
      <div id="mastery-bar" class="progress-bar"></div>
      <div id="mastery-text" class="progress-text">達成度: 0%</div>
    </div>

    <div class="word-grid" id="wordnote-grid"></div>
    <button class="btn" style="margin-top:auto;" onclick="history.back()">もどる</button>
  </div>
</div>

<script>
// サンプルデータと習熟度ロジック
const WORD_BANK = [
  ["cat","猫"],["dog","犬"],["egg","卵"],["book","本"],["door","ドア"],
  ["apple","りんご"],["house","家"],["water","水"],["sky","空"],["paper","紙"]
];
// ダミーの習熟度データ (実際はfirebaseから取得)
const wordStats = {
  "cat": {history: [1,1,1,1,1]}, // 5回正解
  "dog": {history: [1,0,1,0,1]}, // 3回正解
  "egg": {history: [0,0,0,0,0]}, // 未習得
};

function getProficiencyColor(count) {
  if (count === 5) return '#86efac'; // 5回: 緑
  if (count === 4) return '#bbf7d0'; // 4回: 薄緑
  if (count === 3) return '#fef08a'; // 3回: 黄
  if (count === 2) return '#fed7aa'; // 2回: オレンジ
  if (count === 1) return '#fca5a5'; // 1回: 赤
  return '#e5e7eb'; // 0回: グレー
}

function updateUI() {
  const grid = document.getElementById('wordnote-grid');
  const bar = document.getElementById('mastery-bar');
  const txt = document.getElementById('mastery-text');
  grid.innerHTML = '';
  
  let fullyMastered = 0;
  
  WORD_BANK.forEach(([en, jp]) => {
    const history = (wordStats[en] && wordStats[en].history) || [];
    const correctCount = history.reduce((a, b) => a + b, 0);
    if(correctCount === 5) fullyMastered++;

    const tile = document.createElement('div');
    tile.className = 'word-tile';
    tile.style.backgroundColor = getProficiencyColor(correctCount);
    tile.innerHTML = `
      <div class="word-tile-en">${en}</div>
      <div class="word-tile-jp">${jp}</div>
      <div class="word-tile-score">${correctCount}/5</div>
    `;
    grid.appendChild(tile);
  });

  const masteryPct = Math.floor((fullyMastered / WORD_BANK.length) * 100);
  bar.style.width = `${masteryPct}%`;
  txt.textContent = `達成度: ${masteryPct}%`;
}

updateUI();
</script>
</body>
</html>
